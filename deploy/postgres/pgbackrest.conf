# pgBackRest — nivel 1 de DR (PM-167): repositorio local cifrado.
# La clave de cifrado NO vive acá: se pasa por PGBACKREST_REPO1_CIPHER_PASS desde un archivo 600 fuera
# del repo, con copia fuera del VPS (sin ella el repositorio es irrecuperable).
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-cipher-type=aes-256-cbc
compress-type=zst
compress-level=3

# archive-push asíncrono: PostgreSQL recibe 0 recién cuando el WAL quedó en el spool local (fsync);
# la copia al repositorio sigue en segundo plano. Si el spool supera el tope, el push falla y
# PostgreSQL conserva el WAL (nunca se descarta WAL no archivado).
archive-async=y
spool-path=/var/spool/pgbackrest
archive-push-queue-max=5GiB
process-max=2

start-fast=y
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

[fusion]
pg1-path=/var/lib/postgresql/data/pgdata
