# pgBackRest — nivel 1 de DR (PM-167): repositorio local cifrado.
# La clave de cifrado NO vive acá: se pasa por PGBACKREST_REPO1_CIPHER_PASS desde un archivo 600 fuera
# del repo, con copia fuera del VPS (sin ella el repositorio es irrecuperable).
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-cipher-type=aes-256-cbc
compress-type=zst
compress-level=3

# archive-push asíncrono: pgBackRest devuelve 0 a PostgreSQL recién cuando el segmento llegó al
# repositorio; el spool guarda sólo archivos de estado, no copias del WAL. Mientras no se archive,
# PostgreSQL conserva el segmento en pg_wal (.ready).
# SIN archive-push-queue-max (2026-09-15): al superarlo pgBackRest informa el WAL como archivado, lo
# DESCARTA y corta el PITR (ayuda de 2.59.1). Se prefiere que un disco lleno detenga PostgreSQL antes
# que perder backups sin aviso; la protección es el vigía de capacidad (disco, pg_wal, cola .ready).
archive-async=y
spool-path=/var/spool/pgbackrest
process-max=2

start-fast=y
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

[fusion]
pg1-path=/var/lib/postgresql/data/pgdata
