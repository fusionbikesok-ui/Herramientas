openapi: 3.0.3
info:
  title: FusionBikes — Plataforma API v2 (E1)
  version: 0.1.0
  description: |
    Contrato de E1 (docs/superpowers/deliveries/E1-fundacion-sombra.md). E1 expone sólo salud e
    incidentes; ninguna ruta HTTP llama a MercadoLibre ni a Woo (plan §5.1).

    Convenciones comunes a toda la v2:
    - Fechas ISO 8601 UTC. IDs como string.
    - Error uniforme `Error` con `code` estable, `message` legible, `correlation_id` y `details` opcional.
    - Paginación por cursor opaco (`cursor` / `next_cursor`), nunca por offset.
    - Toda respuesta incluye el header `X-Correlation-Id` (se respeta el recibido si es UUID válido).

servers:
  - url: http://127.0.0.1:3201/api/v2
    description: Sombra local en el VPS (sin publicar)

tags:
  - name: health
  - name: incidents
  - name: signals
  - name: shadow

paths:
  /health:
    get:
      tags: [health]
      summary: Estado de los componentes del núcleo
      description: |
        Sin autenticación pero sólo accesible desde 127.0.0.1 (readiness del despliegue). Consulta
        PostgreSQL con `SELECT 1`, el último heartbeat del worker y del scheduler (≤ 120 s) y el estado
        del archivado de WAL publicado por E0. No expone datos operativos.
      security: []
      responses:
        '200':
          description: Todos los componentes sanos
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Al menos un componente degradado o caído
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /incidents:
    get:
      tags: [incidents]
      summary: Mensajes y comandos que requieren atención
      description: |
        Lista `integrations.incidents` (retryable, uncertain, dead_lettered, parked). Orden estable por
        (opened_at, source_type, source_id). Requiere la capacidad `operations.read`.
      security:
        - sessionCookie: []
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: topic
          in: query
          schema:
            type: string
            enum: [ml.orders, ml.shipments, ml.questions, ml.messages, ml.claims, ml.items, woo.orders, woo.products]
        - name: status
          in: query
          schema:
            type: string
            enum: [retryable, uncertain, dead_lettered, parked]
      responses:
        '200':
          description: Página de incidentes
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentPage' }
        '401':
          description: Sin sesión válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: unauthenticated, message: Se requiere iniciar sesión., correlation_id: 0191f2c4-7b1e-7d3a-9c1f-2b6a1e4d5f60 }
        '403':
          description: Sin la capacidad operations.read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: forbidden, message: No tenés permiso para ver incidentes., correlation_id: 0191f2c4-7b1e-7d3a-9c1f-2b6a1e4d5f61 }
        '422':
          description: Parámetros inválidos (cursor corrupto, limit fuera de rango, enum desconocido)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: invalid_parameter, message: El cursor no es válido., correlation_id: 0191f2c4-7b1e-7d3a-9c1f-2b6a1e4d5f62, details: { parameter: cursor } }

  /shadow/status:
    get:
      tags: [shadow]
      summary: Métricas y alertas de la sombra (E1 T3)
      description: Conteos y edades sin PII, con las alertas activas; cada alerta trae umbral, responsable y runbook. Requiere `operations.read`.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Estado medido en el momento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShadowStatus' }
        '401': { description: Sin sesión, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Sin capacidad, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /internal/v1/reconciliation-signals:
    servers:
      - url: http://127.0.0.1:3201
        description: Plano de control interno; no se publica por Nginx
    post:
      tags: [signals]
      summary: Recibe una señal de reconciliación del legado (E1 T3)
      description: |
        Una señal es un aviso, no una observación: nunca se proyecta. La cuenta la resuelve la
        configuración del servidor por canal; el cliente no envía un UUID. Cuerpo máximo 16 KiB.
        Firma v1 = HMAC-SHA256 en hex sobre `v1\n{timestamp}\n{nonce}\nPOST\n{path}\n{sha256(cuerpo) hex}`,
        con cualquiera de las claves vigentes (rotación con dos claves). Ventana de 300 s. Un nonce
        repetido es un replay y responde 401 aunque la firma sea válida; un aviso repetido con nonce
        nuevo responde 202 `duplicate` sin crear otra señal. Origen fuera de las redes internas: 401.
      security:
        - internalHmac: []
      parameters:
        - { name: x-fusion-key-id, in: header, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' } }
        - { name: x-fusion-timestamp, in: header, required: true, schema: { type: string, pattern: '^[0-9]{1,12}$' } }
        - { name: x-fusion-nonce, in: header, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' } }
        - { name: x-fusion-signature, in: header, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignalEnvelope' }
      responses:
        '202':
          description: Señal aceptada o duplicada (sin segunda fila)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignalAccepted' }
        '400': { description: Envelope inválido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Origen, firma, ventana, clave o nonce inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Canal o tópico sin cuenta configurada, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: Cuerpo mayor a 16 KiB, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: PostgreSQL no disponible, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /internal/v1/informes/estado:
    servers:
      - url: http://127.0.0.1:3201
        description: Plano de control interno; no se publica por Nginx
    get:
      tags: [signals]
      summary: Estado de los informes diarios firmados, para el vigilante del legado (E1 T4)
      description: |
        Devuelve la fecha del último reporte avisado y las entregas que llevan más de 24 h sin subir. La
        consulta el legado a las 09:00 ART y, si falta el informe del día o hay atrasadas, abre el incidente.
        Misma firma v1 que la ruta de señales, con método GET y cuerpo vacío. Es una lectura sin efectos: no
        registra nonces. Existe sólo si la API interna de señales está configurada; si no, 404.
      security:
        - internalHmac: []
      parameters:
        - { name: x-fusion-key-id, in: header, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' } }
        - { name: x-fusion-timestamp, in: header, required: true, schema: { type: string, pattern: '^[0-9]{1,12}$' } }
        - { name: x-fusion-nonce, in: header, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' } }
        - { name: x-fusion-signature, in: header, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
      responses:
        '200':
          description: Estado de los informes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ultimo, atrasadas]
                properties:
                  ultimo: { type: [string, 'null'], format: date }
                  atrasadas:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [tipo, fecha]
                      properties:
                        tipo: { type: string, enum: [manifiesto, reporte] }
                        fecha: { type: string, format: date }
        '401': { description: Origen, firma, ventana o clave inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fusion_v2_session
      description: Sesión del núcleo. En E1 no hay login real de personas; las pruebas usan sesiones de fixture.
    internalHmac:
      type: apiKey
      in: header
      name: x-fusion-signature
      description: HMAC interno del plano de control; ver la descripción de la ruta de señales.

  headers:
    CorrelationId:
      schema: { type: string, format: uuid }

  schemas:
    Error:
      type: object
      required: [code, message, correlation_id]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[a-z_]+$' }
        message: { type: string }
        correlation_id: { type: string, format: uuid }
        details: { type: object, additionalProperties: true }

    SignalEnvelope:
      type: object
      required: [channel, topic, resource_id, fingerprint, source]
      additionalProperties: false
      properties:
        channel: { type: string, enum: [mercadolibre, woocommerce] }
        topic: { type: string, enum: [ml.orders, ml.shipments, ml.questions, ml.messages, ml.claims, ml.items, woo.orders, woo.products] }
        resource_id: { type: string, minLength: 1, maxLength: 512 }
        fingerprint: { type: string, minLength: 1, maxLength: 512 }
        notification_id: { type: string, minLength: 1, maxLength: 256, nullable: true }
        source: { type: string, enum: [webhook_copy, ml_missed_feed] }
        import:
          type: object
          description: Importación de una pérdida del legado (plataforma caída). Deja auditoría encadenada una sola vez por recibo.
          required: [discarded_at, reason]
          additionalProperties: false
          properties:
            discarded_at: { type: string, format: date-time }
            reason: { type: string, enum: [platform_unavailable, platform_timeout] }

    ShadowAlert:
      type: object
      required: [id, severidad, responsable, umbral, valor, runbook]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[a-z_0-9]+$' }
        severidad: { type: string, enum: [alta, media] }
        responsable: { type: string, enum: [operaciones, desarrollo] }
        umbral: { type: string }
        valor: { type: number }
        runbook: { type: string }

    ShadowStatus:
      type: object
      required: [metrics, alerts]
      additionalProperties: false
      properties:
        metrics:
          type: object
          required: [medido_en, senales, barridos]
          properties:
            medido_en: { type: string, format: date-time }
            senales: { type: object }
            barridos: { type: object }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/ShadowAlert' }

    SignalAccepted:
      type: object
      required: [status, correlation_id]
      additionalProperties: false
      properties:
        status: { type: string, enum: [accepted, duplicate] }
        correlation_id: { type: string, format: uuid }

    ComponentStatus:
      type: object
      required: [status, checked_at]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        checked_at: { type: string, format: date-time }
        detail: { type: string, maxLength: 200 }

    Health:
      type: object
      required: [status, components]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        components:
          type: object
          required: [database, worker, scheduler, wal_archive]
          additionalProperties: false
          properties:
            database: { $ref: '#/components/schemas/ComponentStatus' }
            worker: { $ref: '#/components/schemas/ComponentStatus' }
            scheduler: { $ref: '#/components/schemas/ComponentStatus' }
            wal_archive: { $ref: '#/components/schemas/ComponentStatus' }

    Incident:
      type: object
      required: [source_type, source_id, topic, status, opened_at, attempts, correlation_id]
      additionalProperties: false
      properties:
        source_type: { type: string, enum: [inbox, outbox] }
        source_id: { type: string }
        topic: { type: string }
        status: { type: string, enum: [retryable, uncertain, dead_lettered, parked] }
        reason_code: { type: string, nullable: true }
        opened_at: { type: string, format: date-time }
        attempts: { type: integer, minimum: 0 }
        correlation_id: { type: string, format: uuid }

    IncidentPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Incident' }
        next_cursor: { type: string, nullable: true }
