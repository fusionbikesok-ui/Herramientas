<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fusion Bikes — Herramientas</title>
<link rel="stylesheet" href="../lib/theme.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue:       #60A5FA;
  --blue-dim:   rgba(96,165,250,.10);
  --purple:     #A78BFA;
  --purple-dim: rgba(167,139,250,.10);
}

html { font-size: 16px; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Topbar ── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(12,15,22,.9);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2rem;
  height: 54px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-badge { display: inline-flex; flex-direction: column; transform: skewX(-8deg); border-radius: 6px 3px 3px 6px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.brand-badge b { display: block; font-style: italic; font-weight: 800; text-transform: uppercase; font-size: 10px; line-height: 1.25; letter-spacing: -.02em; padding: 1.5px 8px; font-family: Arial, Helvetica, sans-serif; white-space: nowrap; }
.brand-badge .bb-t { background: #08090B; color: #fff; }
.brand-badge .bb-b { background: var(--accent); color: #08090B; }

.topbar-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

.sync-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: .73rem;
  color: var(--muted);
  letter-spacing: .01em;
}

.sync-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: pulse 2.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .35; }
}

/* User avatar chip */
.user-chip {
  display: none;
  align-items: center;
  gap: 7px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 3px 10px 3px 4px;
}

.user-avatar {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--accent);
  color: #0C0F16;
  font-size: .65rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: -.01em;
  text-transform: uppercase;
  flex-shrink: 0;
}

.user-name {
  font-size: .73rem;
  color: var(--text);
  font-weight: 600;
  letter-spacing: .01em;
}

.btn-logout {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 6px;
  padding: 5px 11px;
  font-size: .75rem;
  cursor: pointer;
  font-family: inherit;
  transition: border-color .15s, color .15s;
  letter-spacing: .01em;
}

.btn-logout:hover { border-color: var(--muted); color: var(--text); }

/* ── Main ── */
/* ANCHO COMPLETO (pedido del usuario, 2026-09-12). La grilla aprovecha todo el ancho —más
   tarjetas por fila, menos scroll— pero el TEXTO CORRIDO queda acotado: 45-75 caracteres por
   línea es el rango legible, y una descripción que cruza un monitor de 2560px no se lee.
   Ver docs/superpowers/specs/2026-09-12-home-rediseno-design.md */
.main {
  width: 100%;
  margin: 0;
  padding: 2.75rem 2rem 5rem;
}
/* Lo que se LEE, acotado. Lo que se ESCANEA (la grilla), no. */
.page-desc, .card-desc { max-width: 68ch; }

/* ── Page header ── */
.page-header {
  margin-bottom: 2.75rem;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

.page-header-left {}

.page-eyebrow {
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 6px;
}

.page-title {
  font-size: 1.85rem;
  font-weight: 800;
  letter-spacing: -.05em;
  line-height: 1.1;
  color: var(--text);
}

.page-title em {
  font-style: normal;
  color: var(--accent);
}

.page-desc {
  margin-top: 6px;
  font-size: .83rem;
  color: var(--muted);
  line-height: 1.5;
}

/* ── Category section ── */
.category { margin-bottom: 2.25rem; }

.category-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.category-label {
  font-size: .65rem;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 4px;
  white-space: nowrap;
}

.label-ingreso { background: var(--accent-dim); color: var(--accent); }
.label-control  { background: var(--blue-dim);   color: var(--blue); }
.label-sync     { background: var(--purple-dim); color: var(--purple); }

.category-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── Cards grid ── */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
  gap: 12px;
}
/* En pantallas anchas el problema NO es que falte ancho para las tarjetas: es que un grupo de
   3 las apila a la izquierda y deja media pantalla vacía. La solución es poner los GRUPOS en
   columnas, no estirar las tarjetas: una tarjeta de 700px con una descripción de dos renglones
   se ve rota, y el texto ya está topeado en 68ch por legibilidad. */
@media (min-width: 1700px) {
  #grupos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 2.5rem; align-items: start; }
}
@media (min-width: 2300px) {
  #grupos { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* Herramienta incompleta: se muestra, pero con su estado a la vista. Esconderla es cómo
   llegamos a tener cuatro pantallas construidas que nadie podía alcanzar. */
.card--parcial { opacity: .82; }
.card-estado {
  display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px;
  border-radius: 20px; background: rgba(245,185,66,.14); color: var(--amber, #F5B942);
  margin-left: 8px; vertical-align: middle;
}

/* Card: left color border via box-shadow inset */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.15rem 1.15rem .9rem;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: border-color .18s, background .18s, transform .12s, box-shadow .18s;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

/* Category accent stripe — left edge */
.card.card-ingreso::before,
.card.card-control::before,
.card.card-sync::before {
  content: '';
  position: absolute;
  left: 0;
  top: 16px;
  bottom: 16px;
  width: 3px;
  border-radius: 0 2px 2px 0;
  transition: opacity .18s;
}

.card.card-ingreso::before { background: var(--accent); }
.card.card-control::before  { background: var(--blue); }
.card.card-sync::before     { background: var(--purple); }

/* Hover by category */
.card-ingreso:not(.card--soon):hover {
  border-color: rgba(45,184,232,.4);
  background: var(--surface2);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(45,184,232,.06);
}

.card-control:not(.card--soon):hover {
  border-color: rgba(96,165,250,.4);
  background: var(--surface2);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(96,165,250,.06);
}

.card-sync:not(.card--soon):hover {
  border-color: rgba(167,139,250,.4);
  background: var(--surface2);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(167,139,250,.06);
}

.card--soon {
  opacity: .5;
  cursor: default;
}

.card--soon::before { opacity: .4; }

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.card-icon {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.icon-ingreso { background: var(--accent-dim); color: var(--accent); }
.icon-control  { background: var(--blue-dim);   color: var(--blue); }
.icon-sync     { background: var(--purple-dim); color: var(--purple); }

.card-icon svg { width: 17px; height: 17px; }

.card-badge {
  font-size: .62rem;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
  white-space: nowrap;
}

.card-title {
  font-size: .93rem;
  font-weight: 700;
  letter-spacing: -.02em;
  color: var(--text);
  line-height: 1.3;
}

.card-desc {
  font-size: .8rem;
  color: var(--muted);
  line-height: 1.55;
  flex: 1;
}

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 2px;
  padding-top: 9px;
  border-top: 1px solid var(--border);
}

.card-tag {
  font-size: .67rem;
  color: var(--muted);
  letter-spacing: .03em;
}

.card-arrow {
  color: var(--border);
  transition: color .15s, transform .15s;
  flex-shrink: 0;
}

.card-ingreso:not(.card--soon):hover .card-arrow { color: var(--accent); transform: translateX(3px); }
.card-control:not(.card--soon):hover .card-arrow  { color: var(--blue);   transform: translateX(3px); }
.card-sync:not(.card--soon):hover .card-arrow     { color: var(--purple); transform: translateX(3px); }

/* ── Responsive ── */
@media (max-width: 560px) {
  .topbar { padding: 0 1rem; }
  .main { padding: 2rem 1rem 4rem; }
  .sync-status { display: none; }
  .cards { grid-template-columns: 1fr; }
  .page-title { font-size: 1.5rem; }
}

/* ── Aviso de estado del token de ML ── */
.token-banner {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  border-radius: var(--radius);
  padding: 13px 16px;
  margin-bottom: 14px;
  font-size: .85rem;
  line-height: 1.5;
}
.token-banner.crit {
  background: var(--critical-bg);
  border: 1px solid var(--critical-bd);
  color: var(--text);
}
.token-banner.warn {
  background: var(--warning-bg);
  border: 1px solid var(--warning-bd);
  color: var(--text);
}
.token-banner-icon {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  margin-top: 1px;
}
.token-banner.crit .token-banner-icon { color: var(--critical); }
.token-banner.warn .token-banner-icon { color: var(--warning); }
.token-banner-body { flex: 1; min-width: 0; }
.token-banner-title { font-weight: 700; margin-bottom: 2px; }
.token-banner.crit .token-banner-title { color: var(--critical); }
.token-banner.warn .token-banner-title { color: var(--warning); }
.token-banner-desc { color: var(--muted); }
.token-banner-actions { margin-top: 9px; }
.token-banner-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--critical-bg);
  border: 1px solid var(--critical);
  color: var(--critical);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: .8rem;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  font-family: inherit;
}
.token-banner-btn:hover { background: var(--critical); color: #2A0505; }

/* ── Franja "Requiere tu atención" ── */
.attn-header { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; }
.attn-title { font-size:.95rem; font-weight:800; letter-spacing:-.01em; color:var(--text); }
.attn-updated { font-size:.7rem; color:var(--muted); }

.attn-group { margin-bottom:10px; }
.attn-glabel { font-size:.68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:7px; display:flex; align-items:center; gap:6px; }
.attn-chips { display:flex; gap:10px; flex-wrap:wrap; }

.chip { display:inline-flex; align-items:center; gap:10px; min-height:52px; padding:9px 16px; border-radius:14px; text-decoration:none; cursor:pointer; transition:transform .12s, border-color .15s; }
.chip:hover { transform:translateY(-1px); }
.chip-num { font-size:1.35rem; font-weight:800; font-variant-numeric:tabular-nums; line-height:1; }
.chip-label { font-size:.8rem; color:var(--text); line-height:1.25; }

.chip.crit { background:var(--critical-bg); border:1px solid var(--critical-bd); }
.chip.crit .chip-num { color:var(--critical); }
.chip.warn { background:var(--surface2); border:1px solid var(--warning-bd); }
.chip.warn .chip-num { color:var(--warning); }

.attn-ok { display:inline-flex; align-items:center; gap:8px; background:var(--success-bg); border:1px solid var(--success-bd); border-radius:12px; padding:10px 16px; font-size:.83rem; color:var(--success); font-weight:600; }
.attn-error { display:inline-flex; align-items:center; gap:8px; background:var(--critical-bg); border:1px solid var(--critical-bd); border-radius:12px; padding:10px 16px; font-size:.83rem; color:var(--critical); }
.attn-error button { background:transparent; border:1px solid var(--critical-bd); color:var(--critical); border-radius:6px; padding:3px 9px; font-size:.75rem; cursor:pointer; margin-left:4px; }

.prog-item { background:transparent; border:1px solid var(--border); border-radius:12px; padding:13px 15px; }
.prog-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
.prog-label { font-size:.75rem; color:var(--muted); }
.prog-pct { font-size:.95rem; font-weight:700; font-variant-numeric:tabular-nums; }
.prog-bar { height:7px; border-radius:6px; background:var(--surface2); overflow:hidden; }
.prog-fill { height:100%; border-radius:6px; transition:width .8s cubic-bezier(.16,1,.3,1); }
.prog-sub { font-size:.7rem; color:var(--muted); margin-top:7px; }

/* ── Bloque de alertas de incidentes ── */
.incidentes-container { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:14px; }

.incidentes-group { margin-bottom:14px; }
.incidentes-group:last-child { margin-bottom:0; }
.incidentes-glabel { font-size:.68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; display:flex; align-items:center; gap:6px; }

.incidente-item { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:11px 14px; margin-bottom:8px; display:flex; gap:11px; align-items:flex-start; }
.incidente-item:last-child { margin-bottom:0; }
.incidente-item.crit { border-color:var(--critical-bd); background:var(--critical-bg); }
.incidente-item.warn { border-color:var(--warning-bd); background:var(--warning-bg); }
.incidente-item.info { border-color:var(--success-bd); background:var(--success-bg); }

.incidente-icon { flex-shrink:0; width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:.9rem; }
.incidente-item.crit .incidente-icon { color:var(--critical); }
.incidente-item.warn .incidente-icon { color:var(--warning); }
.incidente-item.info .incidente-icon { color:var(--success); }

.incidente-body { flex:1; min-width:0; }
.incidente-msg { font-size:.82rem; color:var(--text); line-height:1.4; margin-bottom:4px; overflow-wrap:anywhere; word-break:break-word; }
.incidente-meta { font-size:.72rem; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.incidente-severity { font-weight:700; text-transform:capitalize; color:var(--text); }
.incidente-rep { display:inline-flex; align-items:center; gap:4px; }

/* Estados de carga/error/vacío */
.incidentes-loading { display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--muted); padding:10px 0; }
.incidentes-spinner { width:14px; height:14px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.incidentes-error { background:var(--critical-bg); border:1px solid var(--critical-bd); border-radius:10px; padding:10px 14px; font-size:.85rem; color:var(--critical); }
.incidentes-error--info { background:var(--surface2); border:1px solid var(--border); color:var(--text); }

.incidentes-empty { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:.85rem; color:var(--muted); text-align:center; }

.incidentes-overflow { font-size:.75rem; color:var(--muted); padding:6px 0; font-style:italic; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-badge"><b class="bb-t">Fusion</b><b class="bb-b">Bikes</b></span>
  </div>

  <div class="topbar-right">
    <div class="sync-status" id="sync-status">
      <div class="sync-dot"></div>
      <span id="sync-label">Conectando…</span>
    </div>
    <div class="user-chip" id="user-chip">
      <div class="user-avatar" id="user-avatar"></div>
      <span class="user-name" id="user-name"></span>
    </div>
    <button class="btn-logout" onclick="logout()">Salir</button>
  </div>
</header>

<main class="main">
  <div class="page-header">
    <div class="page-header-left">
      <div class="page-eyebrow" id="page-eyebrow">Fusion Bikes</div>
      <h1 class="page-title" id="page-title">Panel de <em>herramientas</em></h1>
      <p class="page-desc">Operaciones internas — Stock, catálogo y sincronización.</p>
    </div>
  </div>

  <!-- ESTADO DEL TOKEN ML — arriba de todo dentro de la zona de atención -->
  <div id="token-ml-banner"></div>

  <!-- PREGUNTAS Y MENSAJES ML SIN RESPONDER -->
  <div id="notif-ml-banner"></div>

  <!-- ALERTAS DE INCIDENTES ACTIVOS — solo admins -->
  <div id="incidentes-alertas" role="region" aria-live="polite" aria-label="Alertas de incidentes activos del sistema"></div>

  <!-- REQUIERE TU ATENCIÓN -->
  <section id="panel-atencion" style="display:none;margin-bottom:22px">
    <div class="attn-header">
      <span class="attn-title">Requiere tu atención</span>
      <span class="attn-updated" id="attn-updated"></span>
    </div>
    <div id="pe-atencion"></div>
  </section>

  <!-- PROGRESO -->
  <section id="panel-progreso" style="display:none;margin-bottom:26px">
    <div id="pe-barras" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px"></div>
  </section>

  <!-- INGRESO -->
  <!-- GRUPOS DE HERRAMIENTAS — se arman solos desde la lista declarativa del script.
       Antes eran tres bloques de HTML escritos a mano: agregar una herramienta era copiar
       y pegar ~10 líneas, y por eso Auditoría de publicaciones quedó meses sin enlace. -->
  <div id="grupos"></div>
</main>

<script src="../lib/format.js"></script>
<script src="../lib/api.js"></script>
<script>
Api.guardBfcache();

function logout() {
  fetch('/api/auth/logout', { method: 'POST' }).finally(function() {
    window.location.href = '/herramientas/login/';
  });
}

// Deriva el id de herramienta desde el href de una tarjeta (/herramientas/<tool>/).
function toolDeHref(href) {
  if ((href || '').indexOf('/herramientas/gestion-pedidos/') === 0) return 'pedidos';
  var m = (href || '').match(/\/herramientas\/([a-z0-9-]+)\//);
  return m ? m[1] : null;
}

fetch('/api/auth/me').then(function(r) {
  if (r.status === 401) { window.location.href = '/herramientas/login/'; throw new Error('redirect'); }
  return r.json();
}).then(function(d) {
  if (!d.ok) return;

  var isAdmin = !!d.is_admin || (d.scopes && d.scopes.indexOf('all') !== -1);
  // Set de herramientas permitidas (para admin: todas)
  var permitidas = {};
  (d.permisos || []).forEach(function(p) { permitidas[p.herramienta] = true; });
  (d.scopes || []).forEach(function(s) { if (s !== 'all') permitidas[s] = true; });

  function tienePermiso(tool) { return isAdmin || !!permitidas[tool]; }

  /* ── LAS HERRAMIENTAS, COMO DATOS ──────────────────────────────────────────
     Agrupadas por TAREA, no por parte del sistema. NN/g, sobre 77 intranets: las estructuras
     por tarea resistieron mejor que las organizadas por departamento y se aprenden más rápido.
     "Control" y "Sincronización" —los grupos viejos— no son cosas que alguien haga.
     Seis grupos, bajo la mediana de 7 que midió NN/g.

     Dentro de cada grupo, PRIMERO LO QUE MÁS SE USA, medido contra la base el 2026-09-12:
     preparación 294, conteo 38 sesiones, gestión de pedidos 2.124. No alfabético.

     `parcial` marca lo que funciona a medias y por qué. Taller, garantías y excepciones dejan
     avanzar un caso existente pero NINGUNA permite crear el primero: por eso tienen 0 filas.
     Se muestran sólo a admin y con el estado a la vista — esconderlas es cómo llegamos a tener
     cuatro pantallas construidas que nadie podía alcanzar. */
  var GRUPOS = [
    { titulo: 'Vender y despachar', color: 'ingreso', tools: [

  var FLECHA = '<svg class="card-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';

  function tarjetaHtml(x) {
    return '<a class="card card-' + x._color + (x.parcial ? ' card--parcial' : '') + '"'
      + ' href="/herramientas/' + x.href + '/" data-tool="' + x.tool + '">'
      + '<div class="card-title">' + escHtml(x.t)
      + (x.parcial ? '<span class="card-estado">' + escHtml(x.parcial) + '</span>' : '') + '</div>'
      + '<div class="card-desc">' + escHtml(x.d) + '</div>'
      + '<div class="card-footer"><span class="card-tag">' + escHtml(x.tag) + '</span>' + FLECHA + '</div></a>';
  }

  function escHtml(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* Un grupo sin ninguna herramienta permitida NO se dibuja. Miguel tiene un solo permiso:
     mostrarle cinco encabezados vacíos sería peor que el panel de hoy. */
  function renderGrupos() {
    var host = document.getElementById('grupos');
    if (!host) return;
    var html = '';
    GRUPOS.forEach(function (g) {
      if (g.adminOnly && !isAdmin) return;
      var visibles = g.tools.filter(function (x) { return tienePermiso(x.tool); });
      if (!visibles.length) return;
      html += '<section class="category"><div class="category-header">'
        + '<span class="category-label label-' + g.color + '">' + escHtml(g.titulo) + '</span>'
        + '<div class="category-line"></div></div><div class="cards">'
        + visibles.map(function (x) { x._color = g.color; return tarjetaHtml(x); }).join('')
        + '</div></section>';
    });
    host.innerHTML = html;
  }

  // Chip de usuario + saludo (para todos)
  var chip = document.getElementById('user-chip');
  if (chip) {
    document.getElementById('user-avatar').textContent = (d.user || '?').charAt(0).toUpperCase();
    document.getElementById('user-name').textContent = d.user;
    chip.style.display = 'flex';
  }
  document.getElementById('page-eyebrow').textContent = 'Hola, ' + d.user;
  document.getElementById('page-title').innerHTML = isAdmin ? 'Panel de <em>herramientas</em>' : 'Tus <em>herramientas</em>';

  // Las tarjetas y el filtrado por permiso los resuelve renderGrupos() con la lista
  // declarativa de GRUPOS: ya no hay tarjetas en el HTML que haya que esconder a mano, ni una
  // tarjeta de Usuarios inyectada aparte.
  renderGrupos();

  // ── Progreso (contexto, subordinado) ──
  function peBarra(label, valor, total, colorVar, sub) {
    var pct = total > 0 ? Math.round(valor / total * 100) : 0;
    return '<div class="prog-item">'
      + '<div class="prog-top"><span class="prog-label">' + label + '</span>'
      + '<span class="prog-pct" style="color:var(' + colorVar + ')">' + pct + '%</span></div>'
      + '<div class="prog-bar"><div class="prog-fill" style="width:' + pct + '%;background:var(' + colorVar + ')"></div></div>'
      + '<div class="prog-sub">' + sub + '</div></div>';
  }

  // Chip de atención. severidad: 'crit' | 'warn'. tool: id de herramienta destino (para
  // filtrar por permiso) o null si no aplica el filtro (ej. ya viene de un fetch acotado
  // por permiso, como el chip de matcher-only).
  function peChip(num, label, severidad, href, tool) {
    if (!num) return null;
    if (tool && !tienePermiso(tool)) return null; // no ofrecer un destino que el usuario no puede abrir
    return { num: num, label: label, severidad: severidad, href: href };
  }

  function renderChips(chips) {
    var crit = chips.filter(function(c) { return c.severidad === 'crit'; });
    var warn = chips.filter(function(c) { return c.severidad === 'warn'; });
    var h = '';
    if (crit.length) {
      h += '<div class="attn-group"><div class="attn-glabel">⚠ Bloquea sync / plata</div><div class="attn-chips">'
        + crit.map(chipHtml).join('') + '</div></div>';
    }
    if (warn.length) {
      h += '<div class="attn-group"><div class="attn-glabel">◔ Pendiente</div><div class="attn-chips">'
        + warn.map(chipHtml).join('') + '</div></div>';
    }
    return h;
  }
  function chipHtml(c) {
    return '<a class="chip ' + c.severidad + '" href="' + c.href + '">'
      + '<span class="chip-num">' + c.num.toLocaleString('es-AR') + '</span>'
      + '<span class="chip-label">' + c.label + '</span></a>';
  }

  function peMostrarAtencion() { document.getElementById('panel-atencion').style.display = 'block'; }
  function peMostrarProgreso() { document.getElementById('panel-progreso').style.display = 'block'; }

  function peError(mensaje, reintentar) {
    document.getElementById('pe-atencion').innerHTML =
      '<div class="attn-error">✗ ' + mensaje + ' <button onclick="(' + reintentar + ')()">Reintentar ↻</button></div>';
    peMostrarAtencion();
  }

  function cargarPanelSoloMatcher() {
    fetch('/api/matcher/push-skus-pendientes/count').then(function(r){return r.json();}).then(function(d){
      if (!d.ok) return;
      var chips = [peChip(d.pendientes, 'SKUs decididos que ML no refleja', 'warn', '/herramientas/identidad-productos/', null)].filter(Boolean);
      document.getElementById('pe-atencion').innerHTML = chips.length ? renderChips(chips)
        : '<span class="attn-ok">✓ Todo al día — nada requiere tu atención.</span>';
      peMostrarAtencion();
    }).catch(function(){ peError('No se pudo cargar el estado.', 'cargarPanelSoloMatcher'); });
  }

  function cargarPanelSync() {
    fetch('/api/sync/dashboard').then(function(r){return r.json();}).then(function(d){
      if (!d.ok) return;
      var st = d.stock || {}, at = d.atencion || {}, sk = d.skus || { escritos: 0, pendientes: 0 };
      var activPend = Math.max(0, (st.pendientes || 0) - (st.pendientesPausadas || 0));
      var totalActiv = (st.sincronizadas || 0) + activPend;

      document.getElementById('pe-barras').innerHTML = [
        peBarra('Stock sincronizado a ML', st.sincronizadas || 0, totalActiv, '--success',
          (st.sincronizadas || 0).toLocaleString('es-AR') + ' publicaciones · ' + (st.pendientesPausadas || 0).toLocaleString('es-AR') + ' pausadas no sincronizan'),
        peBarra('SKUs cargados en ML', sk.escritos, sk.escritos + sk.pendientes, '--accent',
          sk.pendientes.toLocaleString('es-AR') + ' pendientes de escribir en ML')
      ].join('');
      peMostrarProgreso();

      var chips = [
        peChip(at.errores_reales, 'errores de sync', 'crit', '/herramientas/sync-detalle/?cat=errores', 'sync-ml'),
        peChip(at.requiere_atencion_ml, 'con exceso de fotos', 'crit', '/herramientas/sync-detalle/?cat=requiere_atencion_ml', 'sync-ml'),
        peChip(d.reactivables, 'publicaciones pausadas · reactivar', 'warn', '/herramientas/sync-detalle/?cat=reactivables', 'sync-ml'),
        peChip(d.frenadas, 'pausadas frenadas por precio', 'warn', '/herramientas/sync-ml/#frenadas', 'sync-ml'),
        peChip(d.vinculos_sospechosos, 'vínculos sospechosos', 'warn', '/herramientas/vinculos/#sospechosos', 'sync-ml'),
        peChip(sk.pendientes, 'SKUs decididos que ML no refleja', 'warn', '/herramientas/identidad-productos/', 'matcher'),
        peChip(at.sin_mapeo, 'ventas sin mapear', 'warn', '/herramientas/sync-detalle/?cat=sin_mapeo', 'sync-ml'),
        peChip(at.remapeo_requerido, 'a re-mapear', 'warn', '/herramientas/sync-detalle/?cat=remapeo_requerido', 'sync-ml')
      ].filter(Boolean);
      document.getElementById('pe-atencion').innerHTML = chips.length ? renderChips(chips)
        : '<span class="attn-ok">✓ Todo al día — nada requiere tu atención.</span>';
      document.getElementById('attn-updated').textContent = 'actualizado ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
      peMostrarAtencion();
    }).catch(function(){ peError('No se pudo cargar el estado de ML.', 'cargarPanelSync'); });
  }

  // ── Estado del token de ML (banner de atención, arriba de todo) ──
  function humanizarMinutos(min) {
    if (min == null) return '';
    if (min <= 0) return 'ya venció';
    var h = Math.floor(min / 60), m = Math.round(min % 60);
    if (h <= 0) return 'en ' + m + ' min';
    if (m <= 0) return 'en ' + h + ' h';
    return 'en ' + h + ' h ' + m + ' min';
  }

  function renderTokenBanner(t) {
    var host = document.getElementById('token-ml-banner');
    if (!t || (t.ok && !t.motivo && !t.vencido && !t.requiere_reautorizacion)) {
      host.innerHTML = '';
      return;
    }
    var critico = !!(t.vencido || t.requiere_reautorizacion);
    var venceTxt = t.expires_at ? window.Fmt.fecha(t.expires_at) : '—';
    var restanteTxt = humanizarMinutos(t.minutos_restantes);

    var accionesHtml = '';
    if (t.requiere_reautorizacion) {
      if (tienePermiso('config-ml')) {
        accionesHtml = '<div class="token-banner-actions">'
          + '<a class="token-banner-btn" href="' + esc(t.reautorizar_url || '/api/sync/ml-auth-url') + '">Re-autorizar MercadoLibre</a>'
          + '</div>';
      } else {
        accionesHtml = '<div class="token-banner-actions token-banner-desc">Pedile a un admin que re-autorice la conexión con MercadoLibre.</div>';
      }
    }

    var titulo, desc;
    if (critico) {
      titulo = 'El token de MercadoLibre está vencido — el sync está detenido';
      desc = t.vencido
        ? 'Venció' + (venceTxt !== '—' ? ' el ' + venceTxt : '') + '. Nada se sincroniza con ML hasta re-autorizar.'
        : 'Hace falta re-autorizar la conexión con MercadoLibre para que el sync siga funcionando.';
    } else {
      titulo = 'Aviso al renovar el token de MercadoLibre';
      desc = (t.motivo ? esc(t.motivo) : 'Hubo un problema transitorio renovando el token.') + '.'
        + (venceTxt !== '—' ? ' El token actual todavía sirve, vence ' + restanteTxt + ' (' + venceTxt + ').' : '');
    }

    host.innerHTML = '<div class="token-banner ' + (critico ? 'crit' : 'warn') + '" role="' + (critico ? 'alert' : 'status') + '">'
      + '<svg class="token-banner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>'
      + '<div class="token-banner-body">'
      + '<div class="token-banner-title">' + titulo + '</div>'
      + '<div class="token-banner-desc">' + desc + '</div>'
      + accionesHtml
      + '</div></div>';
  }

  fetch('/api/ml/token-estado').then(function(r) { return r.json(); }).then(function(t) {
    if (!t) return;
    renderTokenBanner(t);
  }).catch(function() { /* degradar en silencio: nunca mostrar un banner falso */ });

  // ── Novedades ML pendientes (aviso liviano, permiso 'notificaciones-ml') ──
  // Alcance decidido con el usuario (2026-08-26): solo avisar cuánto hay pendiente y hace
  // cuánto llegó lo más viejo — responder se hace en Mercado Libre, no acá. El link de abajo
  // apunta a la sección de preguntas del panel de vendedor de ML; si no coincide con la URL
  // real de la cuenta, ajustarla (no se pudo verificar en vivo contra el panel).
  function renderNotifMlBanner(d) {
    var host = document.getElementById('notif-ml-banner');
    if (!d || (!d.total && !d.reclamos_sin_confirmar)) { host.innerHTML = ''; return; }
    var partes = [];
    if (d.preguntas) partes.push(d.preguntas + (d.preguntas === 1 ? ' pregunta respondible' : ' preguntas respondibles'));
    if (d.mensajes) partes.push(d.mensajes + (d.mensajes === 1 ? ' mensaje' : ' mensajes'));
    if (d.reclamos) partes.push(d.reclamos + (d.reclamos === 1 ? ' reclamo' : ' reclamos'));
    var desc = partes.join(' · ');
    var detalle = [];
    // Las preguntas de publicaciones pausadas o sin stock se separan: siguen siendo
    // consultas sin responder, pero no se resuelven vendiendo y no deben competir con
    // las que si. Decision del usuario (2026-09-06).
    if (d.preguntas_no_accionables) detalle.push(d.preguntas_no_accionables + ' preguntas no accionables');
    // Jobs de integracion que agotaron reintentos y quedaron muertos. Hasta ahora NADA los
    // mostraba: se quedaban ahi para siempre y nadie se enteraba.
    if (d.dead_letters) {
      var nombresAvisos = {'message.project':'mensajes', 'question.project':'preguntas', 'catalog.woo_product_sync':'sincronizaciones de catálogo'};
      var gruposAvisos = (d.dead_letter_groups || []).map(function(g) {
        return g.n + ' ' + (nombresAvisos[g.job_type] || g.job_type);
      });
      detalle.push('Avisos técnicos: ' + gruposAvisos.join(', '));
    }
    if (d.reclamos_sin_confirmar) detalle.push('Reclamos por consultar: '
      + d.reclamos_sin_confirmar + (d.reclamos_sin_confirmar === 1 ? ' reclamo' : ' reclamos')
      );
    var detalleHtml = detalle.length ? '<div class="token-banner-desc">' + esc(detalle.join(' · ')) + '</div>' : '';
    host.innerHTML = '<div class="token-banner warn" role="status">'
      + '<svg class="token-banner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>'
      + '<div class="token-banner-body">'
      + '<div class="token-banner-title">' + esc(desc || 'Sin pendientes accionables') + '</div>'
      + detalleHtml
      + '<div class="token-banner-actions">'
      + '<a class="token-banner-btn" href="https://myaccount.mercadolibre.com.ar/questions/list" target="_blank" rel="noopener">Abrir bandeja en MercadoLibre</a>'
      + '</div></div></div>';
  }

  if (tienePermiso('notificaciones-ml')) {
    fetch('/api/notificaciones-ml/count').then(function(r) { return r.json(); }).then(function(d) {
      if (!d || !d.ok) return;
      renderNotifMlBanner(d);
    }).catch(function() { /* degradar en silencio */ });

  if (!tienePermiso('sync-ml') && tienePermiso('matcher')) {
    cargarPanelSoloMatcher();
  } else if (tienePermiso('sync-ml')) {
    cargarPanelSync();

  fetch('/api/woo/catalogo').then(function(r) { return r.json(); }).then(function(cat) {
    if (cat.ok && cat.data) {
      document.getElementById('sync-label').textContent =
        cat.data.length.toLocaleString('es-AR') + ' productos';
    }
  }).catch(function() {
    document.getElementById('sync-label').textContent = 'WooCommerce';
  });

  // ── Alertas de incidentes activos (solo para admins) ──
  if (isAdmin) {
    var incidentesHost = document.getElementById('incidentes-alertas');
    var incidentesPollInterval = null;
    var yaCargoUnaVez = false; // Bandera para mostrar spinner solo en la primera carga
    // 2da pasada del revisor (ALTO 3): con incidentes activos (que duran horas), cada poll
    // de 90s reescribía el contenedor `aria-live` aunque los datos fueran IDÉNTICOS, porque
    // el HTML incluía el timestamp "actualizado HH:MM" — un lector de pantalla reanunciaba
    // el bloque completo cada 90s sin que nada relevante hubiera cambiado. Se guarda una
    // firma de los datos (sin el timestamp) y solo se toca el DOM si la firma cambió.
    var ultimaFirmaIncidentes = null;

    // Mapas de traducción para integraciones y procesos (MEDIO 3)
    var labelIntegracion = Object.create(null);
    labelIntegracion['mercadolibre'] = 'MercadoLibre';
    labelIntegracion['woocommerce'] = 'WooCommerce';

    var labelProceso = Object.create(null);
    labelProceso['refrescar_publicaciones'] = 'Refresco de publicaciones';
    labelProceso['refrescar_catalogo'] = 'Refresco de catálogo';

    function renderIncidentes(data) {
      if (!data || !data.data || data.data.length === 0) {
        // Solo tocar el DOM (y disparar el anuncio de aria-live) si de verdad se pasó de
        // "con incidentes" a "sin incidentes" — no en cada poll vacío repetido.
        if (ultimaFirmaIncidentes !== '') incidentesHost.innerHTML = '';
        ultimaFirmaIncidentes = '';
        // El caso "sin incidentes activos" es el camino feliz más común (0 incidentes la
        // mayoría del tiempo) — sin este seteo, el spinner de la primera carga (ALTO 2)
        // seguía parpadeando en CADA poll siguiente porque `yaCargoUnaVez` nunca llegaba
        // a ponerse en true por este return temprano.
        yaCargoUnaVez = true;
        return;
      }

      var incidentes = data.data;

      // Agrupar por integración, usando Object.create(null) para evitar colisión (MEDIO 2)
      var porIntegracion = Object.create(null);
      incidentes.forEach(function(inc) {
        var integ = inc.integracion || 'desconocida';
        if (!porIntegracion[integ]) porIntegracion[integ] = [];
        porIntegracion[integ].push(inc);
      });

      // Ordenar severidades: critico → advertencia → info (MEDIO 2)
      var severidadOrder = Object.assign(Object.create(null), { 'critico': 0, 'advertencia': 1, 'info': 2 });
      // 2da pasada del revisor (ALTO 1): `severidadOrder[sev] || 3` invertía el orden —
      // 'critico' vale 0, y `0 || 3` da 3 (0 es falsy en JS), así que lo más urgente
      // terminaba ordenado ÚLTIMO tanto dentro de cada grupo como en qué grupo se muestra
      // primero. Hace falta un chequeo explícito de "¿existe la clave?", no un `||`.
      function ordenSeveridad(sev) {
        var v = severidadOrder[sev];
        return typeof v === 'number' ? v : 3;
      }
      Object.keys(porIntegracion).forEach(function(k) {
        porIntegracion[k].sort(function(a, b) {
          return ordenSeveridad(a.severidad) - ordenSeveridad(b.severidad);
        });
      });

      // Calcular severidad máxima por integración (MEDIO 1)
      var severidadMaxPorIntegracion = Object.create(null);
      Object.keys(porIntegracion).forEach(function(integ) {
        var incs = porIntegracion[integ];
        var maxSev = 3; // default si no hay incidentes
        incs.forEach(function(inc) {
          maxSev = Math.min(maxSev, ordenSeveridad(inc.severidad));
        });
        severidadMaxPorIntegracion[integ] = maxSev;
      });

      // Ordenar integraciones por severidad máxima, luego alfabético (MEDIO 1)
      var integOrdenadas = Object.keys(porIntegracion).sort(function(a, b) {
        var sevA = severidadMaxPorIntegracion[a];
        var sevB = severidadMaxPorIntegracion[b];
        if (sevA !== sevB) return sevA - sevB; // crítico primero (0 < 1 < 2)
        return a.localeCompare(b); // desempate alfabético
      });

      // Firma determinística de los datos (ALTO 3): si es idéntica a la del poll anterior,
      // no se toca el DOM — evita reanunciar aria-live cada 90s por un timestamp que cambia
      // solo. Ordenada por id para que el resultado no dependa del orden de llegada.
      // 3ra pasada del revisor (MEDIO 2): `total`/`pageSize` se muestran en el pie ("Total: X
      // incidentes activos, mostrando Y") pero no entraban en la firma — si un incidente FUERA
      // de la página 1 se resolvía, el total real bajaba pero los 100 mostrados no cambiaban,
      // y el pie quedaba mintiendo indefinidamente. Se agrega al final de la firma.
      var firma = incidentes
        .map(function(inc) { return inc.id + '|' + inc.estado + '|' + inc.severidad + '|' + inc.contador_repeticiones; })
        .sort()
        .join(',') + '#' + data.total + '/' + data.pageSize;
      var huboCambio = firma !== ultimaFirmaIncidentes;
      if (!huboCambio) {
        // 3ra pasada del revisor (MEDIO 1): aunque los datos no cambiaron, el timestamp
        // "actualizado HH:MM" sí debe reflejar que el poll siguió corriendo — sin esto, un
        // incidente crítico activo por horas sin repetirse deja el timestamp congelado en la
        // hora del primer render, y el operador puede leer eso como "el dashboard se colgó".
        // Actualizado por textContent (no reescribe el resto del DOM, no dispara aria-live).
        var elTs = document.getElementById('incidentes-updated');
        if (elTs) elTs.textContent = 'actualizado ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
        yaCargoUnaVez = true;
        return;
      }
      ultimaFirmaIncidentes = firma;

      var html = '<div class="incidentes-container">'
        + '<div class="attn-header">'
        + '<span class="attn-title">Alertas de incidentes activos</span>'
        + '<span class="attn-updated" id="incidentes-updated" aria-hidden="true">actualizado ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }) + '</span>'
        + '</div>';

      // Mostrar cada integración con sus incidentes (en orden de severidad)
      integOrdenadas.forEach(function(integ) {
        var incs = porIntegracion[integ];
        var label = labelIntegracion[integ] || integ.charAt(0).toUpperCase() + integ.slice(1);
        html += '<div class="incidentes-group">'
          + '<div class="incidentes-glabel">' + esc(label) + '</div>';

        incs.slice(0, 100).forEach(function(inc) {
          var severidad = inc.severidad || 'info';
          var severidadClass = severidad === 'critico' ? 'crit' : (severidad === 'advertencia' ? 'warn' : 'info');
          var icon = severidad === 'critico' ? '⚠' : (severidad === 'advertencia' ? '◔' : 'ℹ');
          var severidadTexto = severidad === 'critico' ? 'Crítico' : (severidad === 'advertencia' ? 'Advertencia' : 'Info');

          var proceso = inc.proceso || 'proceso desconocido';
          var procesoLabel = labelProceso[proceso] || proceso;

          html += '<div class="incidente-item ' + severidadClass + '">'
            + '<div class="incidente-icon" aria-hidden="true">' + icon + '</div>'
            + '<div class="incidente-body">'
            + '<div class="incidente-msg">' + esc(inc.mensaje_humano || 'Incidente sin descripción') + '</div>'
            + '<div class="incidente-meta">'
            + '<span class="incidente-severity">' + severidadTexto + '</span>'
            + '<span>' + esc(procesoLabel) + '</span>';

          if (inc.contador_repeticiones && Number(inc.contador_repeticiones) > 1) {
            html += '<span class="incidente-rep">×' + Number(inc.contador_repeticiones) + '</span>';
          }

          html += '</div></div></div>';
        });

        if (incs.length > 100) {
          html += '<div class="incidentes-overflow">+' + (incs.length - 100) + ' más no mostrados</div>';
        }

        html += '</div>';
      });

      if (data.total && Number(data.total) > Number(data.pageSize)) {
        html += '<div class="incidentes-overflow">Total: ' + Number(data.total) + ' incidentes activos (mostrando ' + Number(data.pageSize) + ')</div>';
      }

      html += '</div>';
      incidentesHost.innerHTML = html;
      yaCargoUnaVez = true; // Marcar que ya cargó una vez (ALTO 2)
    }

    function cargarIncidentes() {
      // ALTO 2: mostrar spinner solo en la primera carga
      if (!yaCargoUnaVez) {
        incidentesHost.innerHTML = '<div class="incidentes-container">'
          + '<div class="incidentes-loading">'
          + '<div class="incidentes-spinner"></div>'
          + '<span>Cargando incidentes…</span>'
          + '</div></div>';
      }

      fetch('/api/incidentes?estado=activo&pageSize=100').then(function(r) {
        if (r.status === 401 || r.status === 403) {
          var errAuth = new Error('No autorizado');
          errAuth.noAutorizado = true;
          throw errAuth;
        }
        return r.json();
      }).then(function(d) {
        if (d && d.ok) {
          renderIncidentes(d);
        } else {
          // ALTO 1: mostrar error en vez de vaciar si d.ok === false
          incidentesHost.innerHTML = '<div class="incidentes-container">'
            + '<div class="incidentes-error incidentes-error--info"><span aria-hidden="true">⊛</span> No se pudo consultar el estado de incidentes. Se reintenta solo en un momento.</div>'
            + '</div>';
          yaCargoUnaVez = true;
          // El DOM ya no refleja la última firma "buena" — sin este reset, si el próximo
          // poll exitoso trae EXACTAMENTE los mismos incidentes de antes del error, el
          // chequeo de firma del ALTO 3 los daría por "sin cambios" y dejaría el mensaje
          // de error pegado en pantalla para siempre en vez de recuperarse.
          ultimaFirmaIncidentes = null;
        }
      }).catch(function(err) {
        // 4ta pasada del revisor (MEDIO 1): un 401/403 (sesión de admin vencida con la
        // pestaña abierta todo el día, el uso típico de este dashboard) NUNCA se arregla
        // reintentando — el copy genérico de abajo ("se reintenta solo") le mentía al
        // operador, y el polling seguía golpeando el endpoint cada 90s para siempre. Corta
        // el intervalo y muestra un mensaje que describe la acción real disponible.
        if (err && err.noAutorizado) {
          clearInterval(incidentesPollInterval);
          incidentesHost.innerHTML = '<div class="incidentes-container">'
            + '<div class="incidentes-error incidentes-error--info"><span aria-hidden="true">⊛</span> Tu sesión venció. Volvé a iniciar sesión para ver los incidentes activos.</div>'
            + '</div>';
          yaCargoUnaVez = true;
          ultimaFirmaIncidentes = null;
          return;
        }
        // ALTO 1 + MEDIO 7 (1ra pasada) + MEDIO 1/3 (2da pasada): error visible pero
        // distinto de un incidente crítico real; ícono con aria-hidden (mismo criterio que
        // el ícono de severidad); copy en voseo (convención del resto de public/) sin filtrar
        // err.message crudo del navegador a un mensaje pensado para el operador — el detalle
        // técnico va a la consola, no a la UI.
        console.warn('[incidentes] no se pudo consultar el estado:', err.message);
        incidentesHost.innerHTML = '<div class="incidentes-container">'
          + '<div class="incidentes-error incidentes-error--info"><span aria-hidden="true">⊛</span> No se pudo consultar el estado de incidentes. Se reintenta solo en un momento.</div>'
          + '</div>';
        yaCargoUnaVez = true;
        ultimaFirmaIncidentes = null; // mismo motivo que arriba: forzar el repintado al recuperarse
      });
    }

    // Cargar inicial y luego polling cada 90 segundos
    cargarIncidentes();
    incidentesPollInterval = setInterval(cargarIncidentes, 90000);
  }
}).catch(function() {});
</script>
</body>
</html>
