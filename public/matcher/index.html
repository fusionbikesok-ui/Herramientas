<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matcher — Fusion Bikes</title>
  <link rel="stylesheet" href="../lib/theme.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
    a { color: inherit; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .hidden { display: none !important; }

    /* ── Topbar ──────────────────────────────────────────────────────── */
    .topbar { position: sticky; top: 0; z-index: 40; background: rgba(12,15,22,.92); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 .75rem; height: 54px; gap: 8px; }
    .topbar-title { font-size: .9rem; font-weight: 700; flex: 1; text-align: center; }
    .topbar-back { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; color: var(--muted); text-decoration: none; padding: 8px; white-space: nowrap; }
    .topbar-back:hover, .topbar-back:focus-visible { color: var(--accent); }

    /* ── Filtros y buscador (sticky) ──────────────────────────────────── */
    .filtros-header { position: sticky; top: 54px; z-index: 35; background: var(--bg); border-bottom: 1px solid var(--border); padding: .6rem .75rem; }
    .filtros-row { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; margin-bottom: .6rem; }
    .chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; min-height: var(--tap-min); padding: 0 12px; border-radius: var(--radius-pill); font-size: .76rem; font-weight: 600; white-space: nowrap; background: var(--chip-bg); border: 1px solid var(--chip-bd); color: var(--chip-txt); font-family: inherit; cursor: pointer; text-decoration: none; transition: border-color .15s; }
    .chip:hover, .chip:focus-visible { border-color: var(--accent); }
    .chip.active { background: var(--chip-on-bg); border-color: var(--chip-on-bd); color: var(--chip-on-txt); }
    .chip .badge { font-size: .7rem; color: var(--muted); margin-left: 3px; }
    .chip.active .badge { color: var(--chip-on-txt); }

    .search-box { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: .85rem; font-family: inherit; outline: none; min-height: var(--tap-min); }
    .search-box:focus { border-color: var(--accent); }

    /* ── Barra de progreso ──────────────────────────────────────── */
    .progress-bar-wrap { background: var(--bg); border-bottom: 1px solid var(--border); padding: .5rem .75rem; font-size: .75rem; }
    .progress-bar-track { height: 6px; background: var(--progress-track); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
    .progress-bar-fill { height: 100%; background: var(--progress-fill); transition: width .3s ease; }
    .progress-stats { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); }
    .progress-stat { font-variant-numeric: tabular-nums; }
    .progress-stat .label { color: var(--muted); font-size: .7rem; text-transform: uppercase; }

    /* ── Contenedor de dos paneles ──────────────────────────────────────── */
    .matcher-container { display: flex; gap: 0; min-height: calc(100vh - 54px); }
    .panel-left { flex: 1; min-width: 280px; border-right: 1px solid var(--border); overflow-y: auto; background: var(--bg); }
    .panel-right { flex: 1.2; min-width: 320px; overflow-y: auto; background: var(--surface); display: none; }
    .panel-right.active { display: flex; flex-direction: column; }

    /* En mobile, mostrar solo un panel a la vez */
    @media (max-width: 1024px) {
      .matcher-container { flex-direction: column; }
      .panel-left { min-width: auto; border-right: none; border-bottom: 1px solid var(--border); }
      .panel-right { min-width: auto; border-bottom: none; }
      .panel-right.active { display: flex; }
    }

    /* ── Lista de publicaciones (panel izquierdo) ──────────────────────────── */
    .pub-list { display: flex; flex-direction: column; gap: 0; }
    .pub-item { background: var(--surface); border-bottom: 1px solid var(--border); padding: .75rem; cursor: pointer; transition: background .15s; min-height: var(--tap-comfort); display: flex; flex-direction: column; justify-content: center; }
    .pub-item:hover, .pub-item:focus-visible { background: var(--surface2); outline: none; }
    .pub-item.active { background: var(--accent-dim); border-left: 3px solid var(--accent); padding-left: calc(.75rem - 3px); }
    .pub-item-title { font-size: .9rem; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
    .pub-item-meta { font-size: .75rem; color: var(--muted); margin-bottom: 4px; }
    .pub-item-badge { display: inline-flex; align-items: center; gap: 4px; font-size: .7rem; padding: 2px 8px; border-radius: var(--radius-pill); background: var(--surface2); border: 1px solid var(--border); }
    .pub-item-badge.score-high { background: rgba(52,211,153,.12); border-color: rgba(52,211,153,.35); color: var(--green); }
    .pub-item-badge.score-med { background: rgba(251,191,36,.12); border-color: rgba(251,191,36,.35); color: var(--amber); }
    .pub-item-badge.score-low { background: rgba(248,113,113,.12); border-color: rgba(248,113,113,.35); color: var(--red); }
    .pub-item-status { margin-left: auto; font-size: 1rem; }

    /* ── Panel derecho: detalle ──────────────────────────────────────── */
    .detail-panel { padding: 1rem; display: flex; flex-direction: column; }
    .detail-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: .9rem; }

    .mode-badge { display: inline-flex; align-items: center; gap: 5px; font-size: .8rem; padding: 6px 12px; border-radius: 6px; background: var(--accent-dim); color: var(--accent); margin-bottom: 1rem; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    .card-title { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: .5rem; }

    .current-sku { display: flex; gap: 1rem; }
    .sku-photo { width: 80px; height: 80px; flex-shrink: 0; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); object-fit: cover; }
    .sku-info { flex: 1; min-width: 0; }
    .sku-name { font-weight: 600; font-size: .95rem; margin-bottom: 4px; }
    .sku-sku { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .8rem; color: var(--accent); margin-bottom: 6px; }
    .sku-score { display: inline-flex; align-items: center; gap: 4px; font-size: .75rem; padding: 3px 8px; border-radius: 4px; font-weight: 600; }
    .sku-score.high { background: rgba(52,211,153,.12); color: var(--green); }
    .sku-score.med { background: rgba(251,191,36,.12); color: var(--amber); }
    .sku-score.low { background: rgba(248,113,113,.12); color: var(--red); }

    .ml-item { font-size: .85rem; }
    .ml-item-title { font-weight: 600; margin-bottom: 6px; line-height: 1.35; }
    .ml-item-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: .8rem; margin-bottom: 8px; }
    .ml-item-meta dt { color: var(--muted); font-weight: 600; }
    .ml-item-meta dd { color: var(--text); }

    .candidatos-container { margin-top: 0; }
    .candidatos-title { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: .6rem; }
    .candidatos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 1rem; }
    .candidate-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px; cursor: pointer; transition: border-color .15s, background .15s; text-align: left; }
    .candidate-card:hover, .candidate-card:focus-visible { border-color: var(--accent); background: var(--surface); outline: none; }
    .candidate-card.is-current { border: 2px solid var(--accent); padding: 7px; }

    .candidate-photo { width: 100%; aspect-ratio: 1; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); object-fit: cover; margin-bottom: 6px; }
    .candidate-score { font-size: .7rem; font-weight: 600; padding: 2px 6px; border-radius: 3px; display: inline-block; margin-bottom: 4px; }
    .candidate-score.high { background: rgba(52,211,153,.12); color: var(--green); }
    .candidate-score.med { background: rgba(251,191,36,.12); color: var(--amber); }
    .candidate-score.low { background: rgba(248,113,113,.12); color: var(--red); }
    .candidate-sku { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .7rem; color: var(--accent); margin-bottom: 4px; word-break: break-all; }
    .candidate-name { font-size: .75rem; font-weight: 600; margin-bottom: 4px; }
    .candidate-attrs { font-size: .65rem; color: var(--muted); margin-top: 4px; }
    .attr-badge { display: inline-flex; align-items: center; gap: 2px; font-size: .65rem; padding: 1px 4px; border-radius: 3px; margin-top: 2px; }
    .attr-badge.ok { background: rgba(52,211,153,.12); color: var(--green); }
    .attr-badge.fail { background: rgba(248,113,113,.12); color: var(--red); }
    .attr-badge.neutral { color: var(--muted); }

    .manual-sku { margin-bottom: 1rem; }
    .manual-sku-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85rem; outline: none; min-height: var(--tap-min); }
    .manual-sku-input:focus { border-color: var(--accent); }
    .manual-sku-btn { width: 100%; background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 8px 12px; font-size: .8rem; font-weight: 600; cursor: pointer; font-family: inherit; min-height: var(--tap-min); margin-top: 6px; }
    .manual-sku-btn:hover { background: var(--accent); color: #06131C; }

    .actions-footer { display: flex; gap: 6px; margin-top: auto; }
    .btn-action { flex: 1; padding: .6rem .75rem; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-size: .8rem; font-weight: 600; cursor: pointer; font-family: inherit; min-height: var(--tap-min); transition: border-color .15s, color .15s; }
    .btn-action:hover, .btn-action:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
    .btn-action.primary { background: var(--accent); color: #06131C; border-color: var(--accent); }
    .btn-action.primary:hover { background: var(--accent-dk); border-color: var(--accent-dk); }

    /* ── Estados ──────────────────────────────────────────────────────── */
    .status-loading { text-align: center; padding: 2rem 1rem; color: var(--muted); }
    .status-error { background: var(--red-bg); border: 1px solid var(--red-bd); color: var(--red); border-radius: 10px; padding: 1rem; margin: 1rem; }
    .status-empty { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: .9rem; }

    /* ── Toast ──────────────────────────────────────────────────────── */
    .toast-container { position: fixed; bottom: 1rem; left: 1rem; right: 1rem; z-index: 100; max-width: 400px; }
    .toast { background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px; padding: .75rem 1rem; font-size: .85rem; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .toast.ok { border-color: var(--success-bd); }
    .toast.error { border-color: var(--critical-bd); }
    .toast.pending { border-color: var(--warning-bd); }
    .toast-close { background: none; border: 0; color: var(--muted); font-size: 1rem; cursor: pointer; }

    /* ── Carga ──────────────────────────────────────────────────────── */
    .skel { background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-highlight) 37%, var(--skeleton-base) 63%); background-size: 400% 100%; animation: skel-sweep 1.4s ease infinite; }
    @keyframes skel-sweep { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    .skel-item { height: 80px; border-bottom: 1px solid var(--border); }

    /* ── Responsive ──────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .panel-left { min-width: auto; }
      .panel-right { min-width: auto; }
      .candidatos-grid { grid-template-columns: repeat(2, 1fr); }
      .detail-panel { padding: .75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .skel { animation: none; background: var(--skeleton-base); }
      * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <script src="../lib/api.js"></script>
  <script src="../lib/format.js"></script>

  <div class="topbar">
    <a href="/herramientas/home/" class="topbar-back">← Home</a>
    <div class="topbar-title">Matcher</div>
    <div></div>
  </div>

  <div class="filtros-header">
    <div class="filtros-row" id="filters-row" role="tablist">
      <button class="chip active" data-filter="all" role="tab" aria-label="Todos (0)">
        Todos <span class="badge" data-count="0">0</span>
      </button>
      <button class="chip" data-filter="asignar" role="tab" aria-label="Asignar SKU (0)">
        Asignar SKU <span class="badge" data-count="0">0</span>
      </button>
      <button class="chip" data-filter="verificar" role="tab" aria-label="Verificar (0)">
        Verificar <span class="badge" data-count="0">0</span>
      </button>
      <button class="chip" data-filter="conf-baja" role="tab" aria-label="Confianza baja (0)">
        Conf. baja <span class="badge" data-count="0">0</span>
      </button>
      <button class="chip" data-filter="color-talle" role="tab" aria-label="Color y Talle correcto (0)">
        Color+Talle ✓ <span class="badge" data-count="0">0</span>
      </button>
    </div>
    <input type="search" class="search-box" id="search-input" placeholder="Buscar por título o variaciones..." aria-label="Buscar publicaciones por título o variaciones">
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
    </div>
    <div class="progress-stats">
      <span class="progress-stat"><span class="label">Asignados:</span> <span id="stat-asignados">0</span></span>
      <span class="progress-stat"><span class="label">Confirmados:</span> <span id="stat-confirmados">0</span></span>
      <span class="progress-stat"><span class="label">Omitidos:</span> <span id="stat-omitidos">0</span></span>
      <span class="progress-stat"><span class="label">Pendientes:</span> <span id="stat-pendientes">0</span></span>
    </div>
  </div>

  <div class="matcher-container">
    <!-- Panel izquierdo: lista -->
    <div class="panel-left">
      <div class="pub-list" id="pub-list">
        <div class="status-empty">Cargando publicaciones...</div>
      </div>
    </div>

    <!-- Panel derecho: detalle -->
    <div class="panel-right" id="panel-right">
      <div class="detail-panel" id="detail-content">
        <div class="detail-empty">Selecciona una publicación</div>
      </div>
    </div>
  </div>

  <!-- Toast de notificaciones -->
  <div class="toast-container" id="toast-container"></div>

  <script>
    'use strict';

    // Estado global
    const state = {
      allItems: [],
      filteredItems: [],
      currentIndex: 0,
      filter: 'all',
      searchQuery: '',
      decisions: {}, // clave -> { sku, accion }
      computing: false
    };

    // ── Inicialización ──────────────────────────────────────────────────
    async function init() {
      await Api.requirePermiso('matcher');
      Api.installAuth();
      Api.guardBfcache();
      attachEventListeners();
      loadData();
    }

    function attachEventListeners() {
      // Filtros
      document.querySelectorAll('[data-filter]').forEach(btn => {
        btn.addEventListener('click', () => setFilter(btn.dataset.filter));
      });

      // Búsqueda
      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', debounce((e) => {
        state.searchQuery = e.target.value.toLowerCase();
        applyFiltersAndSearch();
        selectItem(0);
      }, 200));

      // Navegación por teclado
      document.addEventListener('keydown', handleKeyboard);

      // Lista de publicaciones
      document.getElementById('pub-list').addEventListener('click', (e) => {
        const item = e.target.closest('.pub-item');
        if (item) {
          const idx = parseInt(item.dataset.idx, 10);
          selectItem(idx);
        }
      });
    }

    // El cómputo completo tarda ~70s en frío y la caché es en memoria: se pierde en cada
    // reinicio del server y cuando entra un refresco completo de publicaciones de ML.
    const ESPERA_COMPUTO_MS = 180000;   // 3 min: el cómputo ronda los 70s, con margen
    const SONDEO_MS = 3000;

    async function pedirCandidatos({ peek }) {
      // scope=atencion (no 'all'): excluye del lado del servidor las publicaciones que ya
      // tienen una decisión guardada en sku_matcher_decisiones (misma función,
      // clavesNecesitanAtencion, que ya usa el dashboard de sync). Sin esto, cada una de las
      // 5 pestañas mostraba el catálogo entero sin filtrar — 6893 publicaciones incluyendo
      // las ~5100 ya resueltas — porque ninguna pestaña filtraba por decisión y el estado de
      // decisiones del cliente arranca vacío en cada carga. Las decisiones nunca se perdieron
      // (siguen en la base), pero la lista no lo reflejaba.
      const qs = new URLSearchParams({ scope: 'atencion' });
      if (peek) qs.set('peek', '1');
      const res = await fetch('/api/matcher/candidatos?' + qs.toString());
      const data = await res.json().catch(() => ({ ok: false, error: 'respuesta ilegible del servidor' }));
      if (!res.ok && !data.computing) throw new Error(data.error || ('HTTP ' + res.status));
      return data;
    }

    // computarCandidatosApi() (routes/matcher.js) devuelve los campos de la publicación
    // prefijados ml_* (ml_title, ml_item_id, ml_status, ml_variations) y sin ningún campo
    // "clave" — el resto de este archivo (renderList/renderDetail, y todo lo que usa
    // state.decisions[item.clave] para trackear decisiones) se escribió contra otros nombres.
    // Sin este mapeo, item.titulo/item_id/status/clave llegan undefined: título vacío en cada
    // fila, "undefined" en el aria-label, Item ID/Status en blanco en el detalle, y CADA
    // decisión se guarda bajo la misma clave undefined en vez de una por publicación.
    function normalizarItems(items) {
      return items.map(it => {
        let variationsTexto = '';
        try {
          const vars = it.ml_variations ? JSON.parse(it.ml_variations) : [];
          variationsTexto = vars.length ? vars.map(v => v.attribute_name + ': ' + v.value_name).join(' • ') : '';
        } catch (_) { /* variations mal formadas: sin texto, no rompemos el render */ }
        return {
          ...it,
          clave: it.ml_item_id + (it.ml_variation_id ? '|' + it.ml_variation_id : ''),
          titulo: it.ml_title,
          item_id: it.ml_item_id,
          status: it.ml_status,
          variations_texto: variationsTexto,
        };
      });
    }

    async function loadData() {
      try {
        // peek nunca dispara el cómputo: si hay caché válida devuelve los datos al toque.
        let data = await pedirCandidatos({ peek: true });

        if (!data.cache) {
          // MISS. El pedido sin peek arranca el cómputo y responde 202 al instante.
          showStatus('Calculando candidatos… puede tardar hasta un minuto y medio', 'loading');
          const arranque = await pedirCandidatos({ peek: false });
          // Si justo terminó entre el peek y esta llamada, ya vienen los datos.
          data = arranque.computing ? await esperarCandidatos() : arranque;
        }

        state.allItems = normalizarItems(data.data || []);
        applyFiltersAndSearch();

        if (state.filteredItems.length === 0) {
          showStatus('Sin publicaciones pendientes', 'empty');
        } else {
          selectItem(0);
        }
      } catch (e) {
        showStatus('Error: ' + e.message, 'error');
      }
    }

    // Sondea hasta que la caché esté lista y DEVUELVE los datos.
    // El bug anterior era esperar `!data.computing`: con peek=1 el endpoint nunca manda ese
    // campo, así que la condición daba verdadera siempre y la espera cortaba a los 2 segundos,
    // dejando a loadData en un bucle de reintentos contra una caché todavía vacía. La única
    // señal válida en el camino de peek es `cache === true`.
    async function esperarCandidatos() {
      const limite = Date.now() + ESPERA_COMPUTO_MS;
      while (Date.now() < limite) {
        await new Promise(r => setTimeout(r, SONDEO_MS));
        const data = await pedirCandidatos({ peek: true });   // un error del cómputo sale por acá
        if (data.cache) return data;
        const faltan = Math.round((limite - Date.now()) / 1000);
        showStatus('Calculando candidatos… (' + faltan + 's antes de cortar)', 'loading');
      }
      throw new Error('el cálculo de candidatos no terminó a tiempo; probá recargar la página');
    }

    function setFilter(filter) {
      state.filter = filter;
      document.querySelectorAll('[data-filter]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      applyFiltersAndSearch();
      selectItem(0);
    }

    function applyFiltersAndSearch() {
      let items = state.allItems;

      // Aplicar filtro
      if (state.filter === 'asignar') {
        items = items.filter(it => it.modo === 'asignar');
      } else if (state.filter === 'verificar') {
        items = items.filter(it => it.modo === 'verificar');
      } else if (state.filter === 'conf-baja') {
        items = items.filter(it => it.modo === 'verificar' && it.score_confianza < 0.7);
      } else if (state.filter === 'color-talle') {
        items = items.filter(it => it.candidatos[0]?.color_ok && it.candidatos[0]?.talle_ok);
      }

      // Aplicar búsqueda
      if (state.searchQuery) {
        items = items.filter(it => {
          const text = (it.titulo + ' ' + (it.variations_texto || '')).toLowerCase();
          return text.includes(state.searchQuery);
        });
      }

      state.filteredItems = items;
      updateCounters();
      renderList();
    }

    function updateCounters() {
      const all = state.allItems.length;
      const asignar = state.allItems.filter(it => it.modo === 'asignar').length;
      const verificar = state.allItems.filter(it => it.modo === 'verificar').length;
      const confBaja = state.allItems.filter(it => it.modo === 'verificar' && it.score_confianza < 0.7).length;
      const colorTalle = state.allItems.filter(it => it.candidatos[0]?.color_ok && it.candidatos[0]?.talle_ok).length;

      document.querySelector('[data-filter="all"] .badge').textContent = all;
      document.querySelector('[data-filter="asignar"] .badge').textContent = asignar;
      document.querySelector('[data-filter="verificar"] .badge').textContent = verificar;
      document.querySelector('[data-filter="conf-baja"] .badge').textContent = confBaja;
      document.querySelector('[data-filter="color-talle"] .badge').textContent = colorTalle;

      const progress = all > 0 ? (state.filteredItems.length / all) * 100 : 0;
      document.getElementById('progress-fill').style.width = progress + '%';

      document.getElementById('stat-pendientes').textContent = state.filteredItems.length;
    }

    function renderList() {
      const list = document.getElementById('pub-list');
      if (state.filteredItems.length === 0) {
        list.innerHTML = '<div class="status-empty">Sin resultados en este filtro</div>';
        return;
      }

      list.innerHTML = state.filteredItems.map((item, idx) => {
        const scoreClass = item.score_confianza !== null
          ? item.score_confianza >= 0.8 ? 'score-high' : item.score_confianza >= 0.5 ? 'score-med' : 'score-low'
          : '';
        const scoreText = item.score_confianza !== null ? Math.round(item.score_confianza * 100) + '%' : '—';
        const statusIcon = state.decisions[item.clave]?.accion === 'asignar' ? '✓' :
                          state.decisions[item.clave]?.accion === 'confirmar' ? '✓' :
                          state.decisions[item.clave]?.accion === 'omitir' ? '○' : '';
        const ariaLabel = `${item.titulo}. ${item.variations_texto ? item.variations_texto + '. ' : ''}${item.modo === 'verificar' ? 'Verificar' : 'Asignar'} SKU. Puntuación ${scoreText}`;

        return `
          <button class="pub-item ${state.currentIndex === idx ? 'active' : ''}" data-idx="${item.idx}" tabindex="${state.currentIndex === idx ? '0' : '-1'}" aria-label="${esc(ariaLabel)}">
            <div class="pub-item-title">${esc(item.titulo)}</div>
            ${item.variations_texto ? `<div class="pub-item-meta">${esc(item.variations_texto)}</div>` : ''}
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
              <span class="pub-item-badge ${scoreClass}">${item.modo === 'verificar' ? '🔍' : '✎'} ${scoreText}</span>
              ${statusIcon ? `<span class="pub-item-status">${statusIcon}</span>` : ''}
            </div>
          </button>
        `;
      }).join('');

      // Actualizar índice local para esta vista filtrada
      const firstIdx = state.filteredItems[0]?.idx;
      if (firstIdx !== undefined) {
        state.currentIndex = state.filteredItems.findIndex(it => it.idx === firstIdx);
      }
    }

    function selectItem(filteredIndex) {
      state.currentIndex = filteredIndex;
      const item = state.filteredItems[filteredIndex];
      if (!item) return;

      // Mostrar panel derecho en mobile
      document.getElementById('panel-right').classList.add('active');

      renderDetail(item);
      renderList(); // Actualizar highlight
    }

    function renderDetail(item) {
      const detail = document.getElementById('detail-content');

      let modesign = item.modo === 'verificar'
        ? '🔍 Verificar SKU existente'
        : '✎ Asignar SKU nuevo';

      let wcActualHtml = '';
      if (item.wc_actual) {
        const confClass = item.score_confianza >= 0.9 ? 'high' : item.score_confianza >= 0.7 ? 'med' : 'low';
        wcActualHtml = `
          <div class="card">
            <div class="card-title">SKU actual cargado en ML</div>
            <div class="current-sku">
              ${item.wc_actual.img ? `<img src="${esc(item.wc_actual.img)}" alt="Foto del SKU actual: ${esc(item.wc_actual.nombre)}" class="sku-photo">` : ''}
              <div class="sku-info">
                <div class="sku-name">${esc(item.wc_actual.nombre)}</div>
                <div class="sku-sku">${esc(item.sku_actual || '—')}</div>
                <span class="sku-score ${confClass}">${Math.round((item.score_confianza || 0) * 100)}%</span>
              </div>
            </div>
          </div>
        `;
      }

      const candidatesHtml = item.candidatos.length > 0 ? `
        <div class="candidatos-container">
          <div class="candidatos-title">Candidatos</div>
          <div class="candidatos-grid">
            ${item.candidatos.slice(0, 8).map((cand, idx) => {
              const isCurrent = cand.wc_sku === item.sku_actual;
              const scoreClass = cand.score >= 0.8 ? 'high' : cand.score >= 0.5 ? 'med' : 'low';
              return `
                <button class="candidate-card ${isCurrent ? 'is-current' : ''}"
                        data-sku="${esc(cand.wc_sku)}"
                        title="${esc(cand.wc_nombre)}"
                        aria-label="Seleccionar SKU ${esc(cand.wc_sku)}: ${esc(cand.wc_nombre)}"
                        onclick="selectCandidate(event, '${esc(cand.wc_sku)}')">
                  ${cand.wc_img ? `<img src="${esc(cand.wc_img)}" alt="Foto: ${esc(cand.wc_nombre)}" class="candidate-photo">` : `<div class="candidate-photo" style="display: flex; align-items: center; justify-content: center; color: var(--muted);">—</div>`}
                  <div class="candidate-score ${scoreClass}">${Math.round(cand.score * 100)}%</div>
                  <div class="candidate-sku">${esc(cand.wc_sku)}</div>
                  <div class="candidate-name">${esc(cand.wc_nombre)}</div>
                  ${cand.color_ok !== null || cand.talle_ok !== null ? `
                    <div class="candidate-attrs">
                      ${cand.color_ok === true ? '<span class="attr-badge ok">✓ Color</span>' : cand.color_ok === false ? '<span class="attr-badge fail">✗ Color</span>' : ''}
                      ${cand.talle_ok === true ? '<span class="attr-badge ok">✓ Talle</span>' : cand.talle_ok === false ? '<span class="attr-badge fail">✗ Talle</span>' : ''}
                    </div>
                  ` : ''}
                </button>
              `;
            }).join('')}
          </div>
        </div>
      ` : '<div class="status-empty">Sin candidatos</div>';

      const mlVars = item.ml_variations ? JSON.parse(item.ml_variations) : [];
      const mlVarsText = mlVars.length > 0
        ? mlVars.map(v => v.attribute_name + ': ' + v.value_name).join(' • ')
        : '(sin variaciones)';

      detail.innerHTML = `
        <div class="mode-badge">${modesign}</div>

        ${wcActualHtml}

        <div class="card">
          <div class="card-title">Publicación ML</div>
          <div class="ml-item">
            <div class="ml-item-title">${esc(item.titulo)}</div>
            <dl class="ml-item-meta">
              <dt>Item ID:</dt>
              <dd><a href="${esc(Fmt.mlUrl(item.item_id))}" target="_blank">${esc(item.item_id)}</a></dd>
              <dt>Status:</dt>
              <dd>${esc(item.status)}</dd>
              <dt>Variaciones:</dt>
              <dd>${esc(mlVarsText)}</dd>
            </dl>
          </div>
        </div>

        ${candidatesHtml}

        <div class="manual-sku">
          <input type="text" class="manual-sku-input" id="manual-sku-input" placeholder="O escribí un SKU manual..." aria-label="Ingresar SKU manual">
          <button class="manual-sku-btn" onclick="selectManualSku()">Usar este SKU</button>
        </div>

        <div class="actions-footer">
          <button class="btn-action" onclick="previousItem()" aria-label="Ir a la publicación anterior (↑/k)">← Ant</button>
          <button class="btn-action" onclick="skipItem()" aria-label="Omitir esta publicación (s)">Omitir</button>
          <button class="btn-action primary" onclick="confirmItem()" aria-label="${item.modo === 'verificar' ? 'Confirmar SKU (Enter)' : 'Aprobar SKU (Enter)'}">${item.modo === 'verificar' ? '✓ Confirmar' : 'Aprobar: ' + (item.sku_actual || 'FB-?')} →</button>
        </div>
      `;
    }

    function selectCandidate(e, sku) {
      e.preventDefault();
      const input = document.getElementById('manual-sku-input');
      input.value = sku;
      input.focus();
    }

    function selectManualSku() {
      const sku = document.getElementById('manual-sku-input').value.trim().toUpperCase();
      if (!sku) {
        toast('Ingresá un SKU', 'error');
        return;
      }
      confirmWithSku(sku);
    }

    async function confirmItem() {
      const item = state.filteredItems[state.currentIndex];
      if (!item) return;

      const sku = item.sku_actual || document.getElementById('manual-sku-input').value.trim().toUpperCase();
      if (!sku) {
        toast('Seleccioná o ingresá un SKU', 'error');
        return;
      }

      await confirmWithSku(sku);
    }

    async function confirmWithSku(sku) {
      const item = state.filteredItems[state.currentIndex];
      if (!item) return;

      const accion = item.modo === 'verificar' ? 'confirmar' : 'asignar';
      const anterior = state.decisions[item.clave];
      // Optimista: marcamos y avanzamos sin esperar a ML, pero si la operación no
      // llega a encolarse revertimos, para no dar por vinculado lo que no lo está.
      state.decisions[item.clave] = { sku, accion, estado: 'pendiente' };
      toast(`SKU registrado: ${sku}`, 'pending');
      nextItem();

      try {
        await vincularSku(item.clave, sku);
        state.decisions[item.clave] = { sku, accion, estado: 'encolado' };
        toast(`✓ ${accion} · ${sku}`, 'ok');
      } catch (e) {
        if (anterior) state.decisions[item.clave] = anterior;
        else delete state.decisions[item.clave];
        toast(`No se pudo vincular ${sku}: ${e.message}`, 'error');
      }
      renderList();
      updateCounters();
    }

    function skipItem() {
      const item = state.filteredItems[state.currentIndex];
      if (!item) return;
      state.decisions[item.clave] = { accion: 'omitir' };
      nextItem();
    }

    function previousItem() {
      if (state.currentIndex > 0) {
        selectItem(state.currentIndex - 1);
      }
    }

    function nextItem() {
      if (state.currentIndex < state.filteredItems.length - 1) {
        selectItem(state.currentIndex + 1);
      } else {
        // Mostrar estado "filtro completo"
        toast('✓ Filtro completado', 'ok');
        document.getElementById('detail-content').innerHTML = '<div class="detail-empty">✓ Filtro completado<br><br><a href="#" onclick="setFilter(\'all\'); return false;">Ver todos</a></div>';
      }
    }

    function handleKeyboard(e) {
      // No disparar si estamos escribiendo en un input o textarea
      if (e.target.matches('input[type="text"], input[type="search"], textarea')) {
        return;
      }

      switch (e.key.toLowerCase()) {
        case 'arrowdown':
        case 'j':
          e.preventDefault();
          nextItem();
          break;
        case 'arrowup':
        case 'k':
          e.preventDefault();
          previousItem();
          break;
        case 'enter':
          e.preventDefault();
          confirmItem();
          break;
        case 's':
          e.preventDefault();
          skipItem();
          break;
      }
    }

    // ── API: vincularSku ──────────────────────────────────────────────────────
    // Contrato: vincularSku(clave, sku) -> Promise<{caso_id}>
    // Encola la vinculación en Guardia ML; el caso se crea al vuelo si no existía.
    // Devuelve 202: la escritura en ML la hace el worker, no esta llamada.
    async function vincularSku(clave, sku) {
      const res = await fetch('/api/guardia-ml/vincular-clave', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clave, sku })
      });
      let data = null;
      try { data = await res.json(); } catch { /* respuesta sin cuerpo */ }
      if (!res.ok || data?.ok === false) {
        throw new Error(data?.error || `HTTP ${res.status}`);
      }
      return data;
    }

    // ── Helpers ────────────────────────────────────────────────────────────
    function debounce(fn, ms) {
      let timeout;
      return function (...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn.apply(this, args), ms);
      };
    }

    function showStatus(msg, type) {
      const list = document.getElementById('pub-list');
      if (type === 'loading') {
        list.innerHTML = '<div class="status-loading">' + esc(msg) + '</div>';
      } else if (type === 'error') {
        list.innerHTML = '<div class="status-error">' + esc(msg) + '</div>';
      } else if (type === 'empty') {
        list.innerHTML = '<div class="status-empty">' + esc(msg) + '</div>';
      }
    }

    function toast(msg, type = 'ok') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.innerHTML = `
        <span>${esc(msg)}</span>
        <button class="toast-close" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    // Iniciar
    init();
  </script>
</body>
</html>
