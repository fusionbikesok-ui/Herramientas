<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garantías</title><link rel="stylesheet" href="../lib/theme.css"><style>body{margin:0;background:var(--dark);color:var(--white);font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.head{display:flex;justify-content:space-between;align-items:center}.muted{color:var(--gray)}.card{background:var(--dark2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:16px}.row{border-top:1px solid var(--border);padding:13px 0}.row:first-child{border-top:0}.badge{display:inline-block;padding:2px 8px;border-radius:12px;background:var(--blue-bg);color:var(--blue);font-size:12px}.btn{border:1px solid var(--border2);border-radius:6px;background:var(--dark3);color:var(--white);padding:7px 10px;cursor:pointer}.empty{padding:20px 0;color:var(--gray)}</style></head><body><main class="wrap"><header class="head"><div><div class="muted">POSVENTA · E19</div><h1>Garantías</h1><div class="muted">Casos, inspecciones y compromisos de reemplazo</div></div><button class="btn" id="refresh">Actualizar</button></header><p id="status" class="muted">Cargando…</p><section class="card"><div id="cases"></div></section></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const data=new Map(),op=()=>`ui-${Date.now()}-${Math.random().toString(36).slice(2)}`;
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||d.code||`HTTP ${r.status}`);return d}
async function inspect(id){const x=data.get(id),result=prompt('Resultado de inspección');if(!x||!result)return;try{await post(`/api/warranties/${id}/inspeccion`,{expected_version:x.expected_version,resultado:result,operation_id:op()});load()}catch(e){alert('Conflicto o error: '+e.message)}}
async function advance(id){const x=data.get(id),next={abierto:'esperando_producto',esperando_producto:'en_revision',en_revision:'reparar'}[x?.estado],nota=next&&prompt('Nota para pasar a '+next);if(!next||!nota)return;try{await post(`/api/warranties/${id}/estado`,{expected_version:x.expected_version,estado:next,nota,operation_id:op()});load()}catch(e){alert('Conflicto o error: '+e.message)}}
async function load(){status.textContent='Actualizando…';try{const r=await fetch('/api/warranties',{credentials:'same-origin'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();data.clear();d.data.forEach(x=>data.set(x.id,x));cases.innerHTML=d.data.length?d.data.map(x=>`<article class="row"><span class="badge">${esc(x.estado)}</span> <b>${esc(x.pedido_id||'sin pedido')}</b><br><span class="muted">${esc(x.sku||'sin SKU')} · responsable: ${esc(x.responsable)} · ${esc(x.motivo)}</span>${x.inspeccion_resultado?`<br><span class="muted">Inspección: ${esc(x.inspeccion_resultado)}</span>`:''}<br><button class="btn" onclick="inspect(${x.id})">Inspeccionar</button> <button class="btn" onclick="advance(${x.id})">Avanzar</button></article>`).join(''):'<div class="empty">Sin garantías registradas</div>';status.textContent='Actualizado '+new Date().toLocaleTimeString()}catch(e){status.textContent='No se pudo cargar: '+e.message}}refresh.addEventListener('click',load);load();
</script></main></body></html>
