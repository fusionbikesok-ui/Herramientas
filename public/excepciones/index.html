<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Excepciones físicas</title><link rel="stylesheet" href="../lib/theme.css"><style>body{margin:0;background:var(--dark);color:var(--white);font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.head{display:flex;justify-content:space-between;align-items:center}.muted{color:var(--gray)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.card{background:var(--dark2);border:1px solid var(--border);border-radius:10px;padding:16px}.row{border-top:1px solid var(--border);padding:12px 0}.row:first-child{border-top:0}.badge{padding:2px 8px;border-radius:12px;background:var(--red-bg);color:var(--red)}.btn{border:1px solid var(--border2);border-radius:6px;background:var(--dark3);color:var(--white);padding:7px 10px;cursor:pointer}.empty{padding:20px 0;color:var(--gray)}</style></head>
<body><main class="wrap"><header class="head"><div><div class="muted">OPERACIÓN · E18</div><h1>Excepciones físicas</h1><div class="muted">Incidentes, tareas y devoluciones a proveedor</div></div><button class="btn" id="refresh">Actualizar</button></header><p id="status" class="muted">Cargando…</p><section class="grid"><div class="card"><h2>Incidentes abiertos</h2><div id="incidentes"></div></div><div class="card"><h2>Devoluciones de clientes</h2><div class="muted">Ventas que ML canceló con el envío ya despachado. El stock se repone recién cuando recibís y clasificás la unidad.</div><div id="clientes"></div></div><div class="card"><h2>Devoluciones a proveedor</h2><div id="proveedor"></div></div></section></main>
<script>
const estadoEl=document.getElementById('status'); // `status` suelto es window.status (un string): no sirve
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(path){const r=await fetch(path,{credentials:'same-origin'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||d.code||'HTTP '+r.status);return d}
function op(){return 'ui-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
const incidentData=new Map(), supplierData=new Map();
async function resolveIncidentById(id,discard){const x=incidentData.get(id);if(!x)return;const motivo=prompt(discard?'Motivo del descarte irreversible':'Resolución del incidente');if(!motivo)return;try{await post(`/api/stock-exceptions/incidentes/${x.id}/${discard?'descarte':'resolver'}`,{expected_version:x.expected_version,motivo,resolucion:motivo,operation_id:op()});load()}catch(e){alert('No se pudo completar: '+e.message)}}
async function advanceById(id){const x=supplierData.get(id);if(!x)return;const next={pendiente:'preparada',preparada:'enviada',enviada:'recibida'}[x.estado];if(!next)return;const motivo=prompt('Motivo del cambio a '+next);if(!motivo)return;try{await post(`/api/stock-exceptions/proveedor/devoluciones/${x.id}/estado`,{expected_version:x.expected_version,estado:next,motivo,operation_id:op()});load()}catch(e){alert('No se pudo avanzar: '+e.message)}}
const clienteData=new Map();let esAdmin=false;
function estadoCliente(x){if(x.woo_cierre_estado==='error')return 'Error al cerrar en Woo, se reintenta: '+x.woo_cierre_error;if(x.woo_cierre_estado==='pendiente')return 'Cerrando en Woo…';if(!x.recibido_en)return 'Esperando que llegue la unidad';return x.clasificacion?'Clasificada: '+x.clasificacion:'Recibida: falta clasificar'}
function filaCliente(x){const acc=!x.recibido_en?`<button class="btn" onclick="recibirCliente(${x.id})">Recibir</button>${esAdmin?` <button class="btn" onclick="noLlegoCliente(${x.id})">No llegó</button>`:''}`:(!x.clasificacion?`<button class="btn" onclick="clasificarCliente(${x.id},true)">Disponible</button> <button class="btn" onclick="clasificarCliente(${x.id},false)">Dañada</button>`:'');return `<div class="row"><b>${esc(x.sku||'sin SKU')}</b> · ${esc(x.cantidad)} u.<br><span class="muted">${esc(x.producto||'')} · orden ML ${esc(x.ml_order_id)} · pedido Woo ${esc(x.wc_order_id||'—')} · ${esc(String(x.creado_en||'').slice(0,10))}</span><br><span class="muted">${esc(estadoCliente(x))}</span><br>${acc}</div>`}
async function noLlegoCliente(id){const x=clienteData.get(id);if(!x)return;const motivo=prompt('Motivo (obligatorio): la unidad no llegó. Se cierra sin reponer stock y sin cancelar el pedido Woo');if(!motivo||!motivo.trim())return;try{await post(`/api/stock-exceptions/devoluciones/${x.id}/no-llego`,{expected_version:x.expected_version,motivo:motivo.trim(),operation_id:op()});load()}catch(e){alert('No se pudo cerrar: '+e.message)}}
async function recibirCliente(id){const x=clienteData.get(id);if(!x)return;try{await post(`/api/stock-exceptions/devoluciones/${x.id}/recibir`,{expected_version:x.expected_version,operation_id:op()});load()}catch(e){alert('No se pudo recibir: '+e.message)}}
async function clasificarCliente(id,disponible){const x=clienteData.get(id);if(!x)return;let body={expected_version:x.expected_version,operation_id:op()};if(!disponible){const motivo=prompt('Motivo del daño');if(!motivo)return;body.motivo=motivo}else body.clasificacion='disponible';try{await post(`/api/stock-exceptions/devoluciones/${x.id}/${disponible?'clasificar':'dano'}`,body);load()}catch(e){alert('No se pudo clasificar: '+e.message)}}
async function load(){estadoEl.textContent='Actualizando…';try{try{const m=await get('/api/auth/me');esAdmin=!!(m&&m.is_admin)}catch(_){esAdmin=false}const [i,p]=await Promise.all([get('/api/stock-exceptions/incidentes?estado=abierto'),get('/api/stock-exceptions/proveedor/devoluciones')]);incidentData.clear();clienteData.clear();const clientes=i.data.filter(x=>x.origen==='devolucion_cliente');i.data=i.data.filter(x=>x.origen!=='devolucion_cliente');clientes.forEach(x=>clienteData.set(x.id,x));i.data.forEach(x=>incidentData.set(x.id,x));supplierData.clear();p.data.forEach(x=>supplierData.set(x.id,x));incidentes.innerHTML=i.data.length?i.data.map(x=>`<div class="row"><span class="badge">${esc(x.severidad)}</span> <b>${esc(x.tipo)}</b><br><span class="muted">${esc(x.sku||'sin SKU')} · ${esc(x.motivo)}</span><br><button class="btn" onclick="resolveIncidentById(${x.id},false)">Resolver</button> <button class="btn" onclick="resolveIncidentById(${x.id},true)">Descartar</button></div>`).join(''):'<div class="empty">Sin incidentes abiertos</div>';document.getElementById('clientes').innerHTML=clientes.length?clientes.map(filaCliente).join(''):'<div class="empty">Sin devoluciones de clientes pendientes</div>';proveedor.innerHTML=p.data.length?p.data.map(x=>`<div class="row"><b>${esc(x.sku)}</b> · ${esc(x.cantidad)} u.<br><span class="muted">${esc(x.proveedor)} · ${esc(x.estado)}${x.tracking?' · '+esc(x.tracking):''}</span>${x.estado==='pendiente'||x.estado==='preparada'||x.estado==='enviada'?`<br><button class="btn" onclick="advanceById(${x.id})">Avanzar</button>`:''}</div>`).join(''):'<div class="empty">Sin devoluciones registradas</div>';estadoEl.textContent='Actualizado '+new Date().toLocaleTimeString()}catch(e){estadoEl.textContent='No se pudo cargar: '+e.message}}
refresh.addEventListener('click',load);load();
</script></body></html>
