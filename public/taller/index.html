<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taller</title><link rel="stylesheet" href="../lib/theme.css"><style>body{margin:0;background:var(--dark);color:var(--white);font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.head{display:flex;justify-content:space-between;align-items:center}.muted{color:var(--gray)}.card{background:var(--dark2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:16px}.row{border-top:1px solid var(--border);padding:13px 0}.row:first-child{border-top:0}.badge{display:inline-block;padding:2px 8px;border-radius:12px;background:var(--blue-bg);color:var(--blue);font-size:12px}.btn{border:1px solid var(--border2);border-radius:6px;background:var(--dark3);color:var(--white);padding:7px 10px;cursor:pointer}.empty{padding:20px 0;color:var(--gray)}</style></head><body><main class="wrap"><header class="head"><div><div class="muted">OPERACIÓN · E20</div><h1>Taller</h1><div class="muted">Trabajos, diagnóstico y repuestos</div></div><button class="btn" id="refresh">Actualizar</button></header><p id="status" class="muted">Cargando…</p><section class="card"><div id="jobs"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){status.textContent='Actualizando…';try{const r=await fetch('/api/workshop',{credentials:'same-origin'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();jobs.innerHTML=d.data.length?d.data.map(x=>`<article class="row"><span class="badge">${esc(x.estado)}</span> <b>${esc(x.codigo)}</b> · ${esc(x.tipo)}<br><span class="muted">${esc(x.cliente||'sin cliente')} · ${esc(x.sku||'sin SKU')} · ${esc(x.motivo||'')}</span>${x.presupuesto!=null?`<br><span class="muted">Presupuesto: ${esc(x.presupuesto)} (${esc(x.presupuesto_estado)})</span>`:''}</article>`).join(''):'<div class="empty">Sin trabajos registrados</div>';status.textContent='Actualizado '+new Date().toLocaleTimeString()}catch(e){status.textContent='No se pudo cargar: '+e.message}}refresh.addEventListener('click',load);load();</script></main></body></html>
