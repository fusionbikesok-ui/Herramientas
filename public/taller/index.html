<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taller</title><link rel="stylesheet" href="../lib/theme.css"><style>body{margin:0;background:var(--dark);color:var(--white);font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.head{display:flex;justify-content:space-between;align-items:center}.muted{color:var(--gray)}.card{background:var(--dark2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:16px}.row{border-top:1px solid var(--border);padding:13px 0}.row:first-child{border-top:0}.badge{display:inline-block;padding:2px 8px;border-radius:12px;background:var(--blue-bg);color:var(--blue);font-size:12px}.btn{border:1px solid var(--border2);border-radius:6px;background:var(--dark3);color:var(--white);padding:7px 10px;cursor:pointer}.empty{padding:20px 0;color:var(--gray)}</style></head><body><main class="wrap"><header class="head"><div><div class="muted">OPERACIÓN · E20</div><h1>Taller</h1><div class="muted">Trabajos, diagnóstico y repuestos</div></div><button class="btn" id="refresh">Actualizar</button></header><p id="status" class="muted">Cargando…</p><section class="card"><div id="jobs"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const data=new Map();const op=()=>crypto.randomUUID();async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}async function state(id){const x=data.get(id),next={pendiente:'en_trabajo',en_trabajo:'listo',listo:'cerrado'}[x.estado];if(!next)return alert('No hay siguiente estado');if(!confirm('Cambiar '+x.codigo+' a '+next+'?'))return;try{await post('/api/workshop/'+id+'/estado',{estado:next,expected_version:x.version,operation_id:op()});await load()}catch(e){alert('No se pudo cambiar: '+e.message)}}async function diagnose(id){const x=data.get(id),diagnostico=prompt('Diagnóstico',x.diagnostico||'');if(diagnostico===null)return;const presupuesto=prompt('Presupuesto (opcional)',x.presupuesto??'');if(presupuesto===null)return;try{await post('/api/workshop/'+id+'/diagnostico',{diagnostico,presupuesto:presupuesto===''?null:Number(presupuesto),expected_version:x.version,operation_id:op()});await load()}catch(e){alert('No se pudo guardar: '+e.message)}}async function load(){status.textContent='Actualizando…';try{const r=await fetch('/api/workshop',{credentials:'same-origin'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();data.clear();d.data.forEach(x=>data.set(x.id,x));jobs.innerHTML=d.data.length?d.data.map(x=>`<article class="row"><span class="badge">${esc(x.estado)}</span> <b>${esc(x.codigo)}</b> · ${esc(x.tipo)}<br><span class="muted">${esc(x.cliente||'sin cliente')} · ${esc(x.sku||'sin SKU')} · ${esc(x.motivo||'')}</span>${x.presupuesto!=null?`<br><span class="muted">Presupuesto: ${esc(x.presupuesto)} (${esc(x.presupuesto_estado)})</span>`:''}<br><button class="btn" onclick="diagnose('${x.id}')">Diagnóstico</button> <button class="btn" onclick="state('${x.id}')">Avanzar</button></article>`).join(''):'<div class="empty">Sin trabajos registrados</div>';status.textContent='Actualizado '+new Date().toLocaleTimeString()}catch(e){status.textContent='No se pudo cargar: '+e.message}}window.state=state;window.diagnose=diagnose;refresh.addEventListener('click',load);load();</script></main></body></html>
