<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle de sincronización — Fusion Bikes</title>
<style>
  :root{
    --azul:#2DB8E8;--azul-dk:#1C93BD;--oscuro:#0C0F16;
    --surface:#141A25;--surface2:#1B2235;--border:#24304A;--border2:#2E3B57;
    --text:#E4EAF4;--muted:#8493B0;--muted2:#5B6B8C;
    --green:#34D399;--amber:#F5B942;--red:#F87171;
  }
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;margin:0;background:var(--oscuro);color:var(--text);}
  .wrap{max-width:1050px;margin:0 auto;padding:20px 22px 60px;}
  a.back{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);text-decoration:none;margin-bottom:12px;}
  a.back:hover{color:var(--azul);}
  h1{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;margin:6px 0 4px;}
  h1 em{font-style:normal;color:var(--azul);}
  .sub{font-size:12.5px;color:var(--muted);margin:0 0 18px;max-width:70ch;line-height:1.5;}
  .btn{background:var(--azul);color:#06131C;border:0;border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;transition:background .15s;}
  .btn:hover{background:var(--azul-dk);}
  .btn.sec{background:var(--surface2);color:var(--text);font-weight:600;}
  .btn.sec:hover{background:var(--border2);}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn.mini{padding:5px 10px;font-size:12px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);font-weight:600;padding:10px 13px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:10px 13px;border-bottom:1px solid var(--border);vertical-align:top;}
  tr:last-child td{border-bottom:0;}
  .pub-cell{display:flex;gap:10px;align-items:flex-start;}
  .pub-thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;background:var(--surface2);border:1px solid var(--border);flex-shrink:0;}
  .pub-txt{min-width:0;}
  .pub-tit{font-weight:600;}
  .pub-meta{font-size:11px;color:var(--muted2);font-family:'Courier New',monospace;margin-top:3px;}
  .acc-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .err-txt{font-size:12px;color:var(--amber);max-width:340px;white-space:normal;line-height:1.4;}
  .tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;}
  .tag.ok{background:rgba(52,211,153,.13);color:var(--green);}
  .tag.paused{background:rgba(245,185,66,.13);color:var(--amber);}
  .diag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;}
  .diag.ok{background:rgba(52,211,153,.14);color:var(--green);}
  .diag.warn{background:rgba(245,185,66,.14);color:var(--amber);}
  .diag.muted{background:rgba(132,147,176,.14);color:var(--muted);}
  .diag-txt{font-size:11.5px;color:var(--muted);margin-top:5px;white-space:normal;line-height:1.4;max-width:320px;}
  .loading{color:var(--muted2);font-size:13px;padding:34px 0;text-align:center;}
  .msg{font-size:12.5px;margin-top:14px;min-height:16px;}

  .sku-box{position:relative;min-width:230px;}
  .sku-q{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:6px 9px;font-size:12.5px;}
  .sku-q:focus{outline:none;border-color:var(--azul);}
  .sku-results{margin-top:5px;display:flex;flex-direction:column;gap:4px;}
  .sku-opt{text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:5px 8px;font-size:12px;cursor:pointer;}
  .sku-opt:hover{border-color:var(--azul);background:var(--border2);}
  .sku-opt b{color:var(--azul);font-family:'Courier New',monospace;}
  .row-done td{opacity:.5;}
  a.ml-link{color:var(--azul);font-size:12.5px;font-weight:600;text-decoration:none;}
  a.ml-link:hover{text-decoration:underline;}
  .st{font-size:12px;margin-left:8px;}
  .st.ok{color:var(--green);}
  .st.bad{color:var(--red);}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/herramientas/sync-ml/">&larr; Volver al panel de sincronización</a>
  <h1 id="titulo">Detalle</h1>
  <p class="sub" id="desc"></p>
  <div id="cuerpo"><div class="loading">Cargando…</div></div>
  <div class="msg" id="msg"></div>
</div>

<script src="../lib/format.js"></script>
<script src="../lib/api.js"></script>
<script>
Api.installAuth();

function qs(k){return new URLSearchParams(window.location.search).get(k);}
function debounce(fn,ms){var t;return function(){var a=arguments,c=this;clearTimeout(t);t=setTimeout(function(){fn.apply(c,a);},ms);};}

var CATS={
  sin_mapeo:{modo:'mapeo',titulo:'Ventas sin SKU mapeado',desc:'Publicaciones que se vendieron en MercadoLibre pero no están vinculadas a un SKU de WooCommerce. Buscá el producto por SKU o nombre y asignáselo. El stock se sincroniza solo en el próximo ciclo. Si la publicación ya no existe o la venta no es relevante, podés descartarla.'},
  remapeo_requerido:{modo:'mapeo',titulo:'Variaciones a re-mapear',desc:'La variación mapeada ya no existe en ML (se editó o recreó la publicación). Si la venta sigue siendo válida, asignale el SKU correcto a la variación actual desde el Matcher. Si esa variación vieja ya no aplica, descartala: nunca vas a poder re-mapearla con esta clave exacta.'},
  requiere_atencion_ml:{modo:'info',titulo:'Exceso de fotos en ML',desc:'ML no permite actualizar estas publicaciones hasta que bajes la cantidad de fotos en tu cuenta de MercadoLibre. Abrí cada una, quitá fotos y el sync se reanuda solo.'},
  errores:{modo:'diagnostico',titulo:'Errores de sincronización',desc:'Cada fallo se diagnostica en vivo contra MercadoLibre y se ofrece la acción que lo resuelve: reactivar (pausada con stock web), desvincular (la variación ya no existe), descartar (sin stock real / pausada a mano) o reintentar.'},
  reactivables:{modo:'reactivables',titulo:'Publicaciones pausadas reactivables',desc:'ML pausó estas publicaciones por quedarse sin stock, pero ya tenés stock en la web. Reactivarlas les empuja el stock actual y las vuelve a poner activas en ML (si el neto cubre el precio de contado).'},
  push_pendientes:{modo:'push_pendientes',titulo:'SKUs pendientes de escribir en ML',desc:'Estas publicaciones tienen SKU asignado en el Matcher pero todavía no se escribió en MercadoLibre. Escribilas en lote para que ML quede con el SKU correcto.'}
};

// Metadatos por diagnóstico: etiqueta, color del badge y explicación.
var DIAG={
  reactivable:{lbl:'Reactivable',cls:'ok',txt:'Pausada por falta de stock pero hay stock web. Se puede reactivar (si el neto cubre el precio de contado).'},
  sin_stock:{lbl:'Sin stock',cls:'muted',txt:'Pausada por falta de stock y tampoco hay stock web. No es un error real.'},
  pausada_manual:{lbl:'Pausada por vos',cls:'muted',txt:'La pausaste manualmente en ML.'},
  pausada_otro:{lbl:'Pausada',cls:'muted',txt:'Pausada en ML por otro motivo.'},
  estructura_cambiada:{lbl:'Variación inexistente',cls:'warn',txt:'La variación mapeada ya no existe en ML. Desvinculá para re-linkearla desde el Matcher.'},
  reintentable:{lbl:'Reintentable',cls:'warn',txt:'La publicación está activa y debería sincronizar. Reintentá el envío de stock.'},
  no_activa:{lbl:'No activa',cls:'muted',txt:'Cerrada o inaccesible en ML.'}
};

var CAT=qs('cat');
var CFG=CATS[CAT];

if(!CFG){
  document.getElementById('titulo').textContent='Categoría inválida';
  document.getElementById('cuerpo').innerHTML='<div class="loading" style="color:var(--red)">La categoría "'+esc(CAT)+'" no existe.</div>';
}else{
  document.getElementById('titulo').innerHTML='<em>'+esc(CFG.titulo)+'</em>';
  document.getElementById('desc').textContent=CFG.desc;
  cargar();
}

async function cargar(){
  var cont=document.getElementById('cuerpo');
  cont.innerHTML='<div class="loading">Cargando…</div>';
  try{
    if(CFG.modo==='reactivables'){ await cargarReactivables(cont); return; }
    if(CFG.modo==='push_pendientes'){ await cargarPushPendientes(cont); return; }
    var r=await fetch('/api/sync/atencion/'+encodeURIComponent(CAT));
    var d=await r.json();
    if(!d.ok)throw new Error(d.error||'error');
    cont.innerHTML=render(d.data||[]);
    if(CFG.modo==='mapeo')wireMapeo();
  }catch(err){
    cont.innerHTML='<div class="loading" style="color:var(--red)">No se pudo cargar: '+esc(err.message)+'</div>';
  }
}

// El item_id puede no estar en cache (publicación no traída por el Matcher);
// se deriva de la clave (item_id|variation_id) como fallback.
function itemIdOf(row){return row.item_id||String(row.clave||'').split('|')[0];}

function pubCell(row){
  var tit=row.titulo||itemIdOf(row)||row.clave;
  var meta=esc(itemIdOf(row)||row.clave)+(row.variations_texto?(' · '+esc(row.variations_texto)):'');
  var thumb=row.thumbnail
    ? '<img class="pub-thumb" src="'+esc(row.thumbnail)+'" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
    : '<div class="pub-thumb"></div>';
  return '<div class="pub-cell">'+thumb+'<div class="pub-txt"><div class="pub-tit">'+esc(tit)+'</div><div class="pub-meta">'+meta+'</div></div></div>';
}

function render(rows){
  if(!rows.length){
    return '<div class="tbl-wrap"><div class="loading" style="color:var(--green)">✓ Nada pendiente en esta categoría.</div></div>';
  }
  var h='<p class="sub" style="margin-bottom:10px">'+n(rows.length)+' ítem(s) pendientes.</p>';
  h+='<div class="tbl-wrap"><table><thead><tr>';
  if(CFG.modo==='mapeo')      h+='<th>Publicación</th><th>Asignar SKU de WooCommerce</th><th>Estado</th>';
  else if(CFG.modo==='diagnostico') h+='<th>Publicación</th><th>Diagnóstico</th><th>Acción</th>';
  else                        h+='<th>Publicación</th><th>Motivo</th><th>Acción</th>';
  h+='</tr></thead><tbody>';
  rows.forEach(function(row){
    h+='<tr data-clave="'+esc(row.clave)+'">';
    h+='<td>'+pubCell(row)+'</td>';
    if(CFG.modo==='mapeo'){
      if(row.variacion_muerta){
        // La variación vendida ya no existe en ML: asignar sería inútil (el sync borraría
        // el mapeo por "doesn't have a variation"). Solo cabe descartar.
        h+='<td><div class="diag-txt">La variación vendida ya no existe en ML (la publicación se editó o pasó a simple). No se puede re-mapear con esta clave — descartala.</div></td>';
      }else{
        h+='<td><div class="sku-box"><input class="sku-q" placeholder="Buscar SKU o nombre…"><div class="sku-results"></div></div></td>';
      }
      h+='<td class="estado-cell"><div class="acc-btns"><button class="btn mini sec" onclick="descartar(this,\''+esc(row.clave)+'\')">Descartar</button></div><span class="st"></span></td>';
    }else if(CFG.modo==='diagnostico'){
      h+='<td>'+diagCell(row)+'</td>';
      h+='<td>'+accionCell(row)+'</td>';
    }else{
      h+='<td class="err-txt">'+esc(row.error||'ML rechaza la actualización.')+'</td>';
      h+='<td><a class="ml-link" href="'+mlUrl(itemIdOf(row))+'" target="_blank" rel="noopener">Abrir en ML ↗</a></td>';
    }
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

// ── Modo reactivables (portado de sync-ml/index.html) ────────────────────────
var LABELS_PRECIO={bajo:'Neto bajo',alto:'Neto alto',sin_precio:'Sin precio',ok:'OK'};

async function cargarReactivables(cont){
  cont.innerHTML='<div class="loading">Verificando publicaciones pausadas…</div>';
  try{
    try{
      var rc=await fetch('/api/sync/reactivables/conteo');
      var dc=await rc.json();
      if(dc.ok){
        var loading=cont.querySelector('.loading');
        if(loading){
          loading.textContent=dc.totalPublicaciones>0
            ? ('Evaluando '+n(dc.totalPublicaciones)+' publicación(es) — verificando precios en ML (puede tardar unos segundos)…')
            : 'Verificando publicaciones pausadas…';
        }
      }
    }catch(e){/* el conteo es cosmético: si falla, seguimos al detalle igual */}
    var r=await fetch('/api/sync/reactivables');
    var d=await r.json();
    if(!d.ok)throw new Error(d.error||'error');
    cont.innerHTML=renderReactivables(d);
  }catch(err){
    cont.innerHTML='<div class="loading" style="color:var(--red)">No se pudo cargar: '+esc(err.message)+'</div>';
  }
}

function renderReactivables(d){
  var pubs=d.data||[];
  if(!pubs.length){
    return '<div class="tbl-wrap"><div class="loading" style="color:var(--green)">✓ Nada para reactivar por ahora.</div></div>';
  }
  var h='<p class="sub" style="margin-bottom:10px">'+n(d.totalPublicaciones)+' publicaciones ('+n(d.totalVariaciones)+' variaciones) que ML pausó por quedarse sin stock y ya tienen stock en la web.</p>';
  h+='<div class="tbl-wrap"><table><thead><tr>';
  h+='<th><input type="checkbox" id="chk-all" checked onclick="toggleAll(this)"></th>';
  h+='<th>Publicación</th><th>SKU(s)</th><th>Stock web</th><th>Precio ML</th><th>Neto</th><th>Precio contado</th><th>Estado</th></tr></thead><tbody>';
  pubs.forEach(function(p){
    var skus=[...new Set(p.variaciones.map(function(v){return v.sku;}).filter(Boolean))];
    var stockTotal=p.variaciones.reduce(function(a,v){return a+(v.stock_disponible_ml||0);},0);
    var thumb=p.thumbnail?'<img class="pub-thumb" src="'+esc(p.thumbnail)+'" alt="'+esc(p.titulo||p.item_id)+'" loading="lazy" onerror="this.style.visibility=\'hidden\'">':'<div class="pub-thumb"></div>';
    var estado=p.estado||'sin_precio';
    h+='<tr>';
    h+='<td><input type="checkbox" class="chk-item" value="'+esc(p.item_id)+'" checked onchange="actualizarBtnReactivar()"></td>';
    h+='<td><div class="pub-cell">'+thumb+'<div class="pub-txt"><div class="pub-tit">'+esc(p.titulo||p.item_id)+'</div>'
      +'<div class="pub-meta">'+esc(p.item_id)+' · '+p.variaciones.length+' var.</div></div></div></td>';
    h+='<td class="mono">'+esc(skus.slice(0,3).join(', '))+(skus.length>3?(' +'+(skus.length-3)):'')+'</td>';
    h+='<td>'+n(stockTotal)+'</td>';
    h+='<td>'+money(p.precio_ml)+'</td>';
    h+='<td><b>'+money(p.neto)+'</b></td>';
    h+='<td>'+money(p.precio_web)+'</td>';
    h+='<td><span class="tag '+(estado==='ok'?'ok':'paused')+'">'+esc(LABELS_PRECIO[estado]||estado)+'</span></td>';
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="acc-btns" style="margin-top:12px"><button class="btn" id="btn-react" onclick="reactivarSel()">Reactivar '+pubs.length+' seleccionadas</button>'
   +'<button class="btn sec" id="btn-react-cancel" onclick="cancelarReactivar()" style="display:none">Cancelar</button></div>';
  h+='<div class="msg" id="react-msg"></div>';
  return h;
}

function actualizarBtnReactivar(){
  var btn=document.getElementById('btn-react');
  if(!btn)return;
  var sel=document.querySelectorAll('.chk-item:checked').length;
  btn.textContent=sel?('Reactivar '+sel+' seleccionadas'):'Reactivar seleccionadas';
  btn.disabled=!sel;
}

function toggleAll(cb){document.querySelectorAll('.chk-item').forEach(function(x){x.checked=cb.checked;});actualizarBtnReactivar();}

var reactivarCtrl=null;
function cancelarReactivar(){ if(reactivarCtrl)reactivarCtrl.abort(); }

async function reactivarSel(){
  var sel=[...document.querySelectorAll('.chk-item:checked')].map(function(x){return x.value;});
  var msg=document.getElementById('react-msg');
  if(!sel.length){msg.style.color='var(--amber)';msg.textContent='No seleccionaste ninguna publicación.';return;}
  if(!confirm('Vas a reactivar '+sel.length+' publicación(es) en MercadoLibre.\n\nSe les empuja el stock actual de la web y pasan a estado activo. ¿Confirmás?'))return;
  var btn=document.getElementById('btn-react');btn.disabled=true;
  var btnCancel=document.getElementById('btn-react-cancel');
  if(btnCancel){btnCancel.style.display='';btnCancel.disabled=false;}
  reactivarCtrl=new AbortController();
  var CHUNK=10,okTotal=0,errTotal=0,omitTotal=0,noProcTotal=0,fallos=[],omitidos=[];
  var cancelado=false;
  msg.style.color='var(--muted)';
  try{
    for(var i=0;i<sel.length;i+=CHUNK){
      if(reactivarCtrl.signal.aborted){cancelado=true;noProcTotal=sel.length-i;break;}
      msg.textContent='Reactivando… '+Math.min(i+CHUNK,sel.length)+'/'+sel.length+' (podés cancelar; los que ya se están procesando terminan)';
      try{
        var r=await fetch('/api/sync/reactivar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({itemIds:sel.slice(i,i+CHUNK)}),signal:reactivarCtrl.signal});
        var d=await r.json();
        if(!d.ok)throw new Error(d.error||'error');
        (d.resultados||[]).forEach(function(x){
          if(x.ok){okTotal++;}
          else if(x.omitido){omitTotal++;if(omitidos.length<8)omitidos.push(x.item_id+': '+(x.motivo||'omitida'));}
          else{errTotal++;if(fallos.length<8)fallos.push(x.item_id+': '+(x.error||'error'));}
        });
      }catch(e){
        if(e.name==='AbortError'){cancelado=true;noProcTotal=sel.length-i;break;}
        throw e;
      }
    }
    var hayPend=(errTotal||omitTotal||noProcTotal);
    msg.style.color=hayPend?'var(--amber)':'var(--green)';
    msg.textContent=(cancelado?'⚠ Cancelado. ':'✓ ')+'Reactivadas '+okTotal
      +(omitTotal?(' · '+omitTotal+' omitida(s): '+omitidos.join(' | ')):'')
      +(errTotal?(' · '+errTotal+' con error: '+fallos.join(' | ')):'')
      +(noProcTotal?(' · '+noProcTotal+' sin procesar por cancelación'):'')
      +'. Actualizando estado…';
    var cont=document.getElementById('cuerpo');
    await cargarReactivables(cont);
  }catch(err){
    msg.style.color='var(--red)';msg.textContent='✗ '+err.message;
  }finally{
    reactivarCtrl=null;
    btn.disabled=false;
    if(btnCancel){btnCancel.style.display='none';btnCancel.disabled=false;}
  }
}

// ── Modo push_pendientes (escribir SKUs pendientes en ML) ────────────────────
async function cargarPushPendientes(cont){
  try{
    var r=await fetch('/api/matcher/push-skus-pendientes/list');
    var d=await r.json();
    if(!d.ok)throw new Error(d.error||'error');
    cont.innerHTML=renderPushPendientes(d.data||[]);
  }catch(err){
    cont.innerHTML='<div class="loading" style="color:var(--red)">No se pudo cargar: '+esc(err.message)+'</div>';
  }
}

function renderPushPendientes(rows){
  if(!rows.length){
    return '<div class="tbl-wrap"><div class="loading" style="color:var(--green)">✓ No hay SKUs pendientes de escribir en ML.</div></div>';
  }
  var h='<p class="sub" style="margin-bottom:10px">'+n(rows.length)+' SKU(s) pendiente(s) de escribir en ML.</p>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>Publicación</th><th>SKU a escribir</th></tr></thead><tbody>';
  rows.forEach(function(row){
    var thumb=row.thumbnail?'<img class="pub-thumb" src="'+esc(row.thumbnail)+'" alt="'+esc(row.titulo||row.item_id)+'" loading="lazy" onerror="this.style.visibility=\'hidden\'">':'<div class="pub-thumb"></div>';
    h+='<tr><td><div class="pub-cell">'+thumb+'<div class="pub-txt"><div class="pub-tit">'+esc(row.titulo||row.item_id)+'</div>'
      +'<div class="pub-meta">'+esc(row.item_id||row.clave)+'</div></div></div></td>';
    h+='<td class="mono">'+esc(row.sku)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="acc-btns" style="margin-top:12px"><button class="btn" id="btn-push" onclick="escribirPendientes()">Escribir '+rows.length+' SKU(s) en ML</button></div>';
  h+='<div class="msg" id="push-msg"></div>';
  return h;
}

async function escribirPendientes(){
  var btn=document.getElementById('btn-push');
  var msg=document.getElementById('push-msg');
  if(!confirm('Vas a escribir estos SKUs en MercadoLibre. ¿Confirmás?'))return;
  btn.disabled=true;
  var totalEscritos=0,totalErrores=0;
  msg.style.color='var(--muted)';
  try{
    var restantes=1;
    while(restantes>0){
      msg.textContent='Escribiendo… (llevás '+totalEscritos+' escritos)';
      var r=await fetch('/api/matcher/push-skus-pendientes',{method:'POST'});
      var d=await r.json();
      if(!d.ok)throw new Error(d.error||'error');
      totalEscritos+=d.escritos||0;
      totalErrores+=d.errores||0;
      restantes=d.restantes||0;
      if((d.procesados||0)===0)break;
    }
    msg.style.color=totalErrores?'var(--amber)':'var(--green)';
    msg.textContent='✓ Escritos '+totalEscritos+(totalErrores?(' · '+totalErrores+' con error'):'')+'. Actualizando…';
    var cont=document.getElementById('cuerpo');
    await cargarPushPendientes(cont);
  }catch(err){
    msg.style.color='var(--red)';msg.textContent='✗ '+err.message;
  }finally{
    btn.disabled=false;
  }
}

// ── Búsqueda acotada de SKU + asignar (modo mapeo y re-mapeo desde errores) ───
function wireMapeo(){
  document.querySelectorAll('tr[data-clave]').forEach(wireSkuBox);
}
function wireSkuBox(tr){
  var input=tr.querySelector('.sku-q');
  var results=tr.querySelector('.sku-results');
  if(!input||input.dataset.wired)return;
  input.dataset.wired='1';
  input.addEventListener('input',debounce(async function(){
    var q=input.value.trim();
    if(q.length<2){results.innerHTML='';return;}
    try{
      var r=await fetch('/api/sync/buscar-sku?tipo=all&q='+encodeURIComponent(q));
      var d=await r.json();
      results.innerHTML=(d.data||[]).map(function(o){
        return '<button class="sku-opt" data-sku="'+esc(o.sku)+'" data-nombre="'+esc(o.nombre||'')+'"><b>'+esc(o.sku)+'</b> — '+esc(o.nombre||'')+' <span style="color:var(--muted2)">(stock '+n(o.stock)+')</span></button>';
      }).join('');
      results.querySelectorAll('.sku-opt').forEach(function(btn){
        btn.addEventListener('click',function(){
          asignar(tr,tr.getAttribute('data-clave'),btn.getAttribute('data-sku'),btn.getAttribute('data-nombre'));
        });
      });
    }catch(e){results.innerHTML='<div class="err-txt">'+esc(e.message)+'</div>';}
  },300));
}

// ── Modo diagnóstico (vista de errores): celda de diagnóstico + acción por fila ──
function diagCell(row){
  if(!row.diagnostico){
    return '<div class="err-txt">'+esc(row.error||'—')+'</div><div class="diag-txt">No se pudo diagnosticar (ML no respondió). Podés reintentar o descartar.</div>';
  }
  var d=DIAG[row.diagnostico]||{lbl:row.diagnostico,cls:'muted',txt:''};
  var extra='';
  if(row.diagnostico==='reactivable'||row.diagnostico==='sin_stock') extra=' Stock web: '+n(row.stock_web)+'.';
  return '<span class="diag '+d.cls+'">'+esc(d.lbl)+'</span><div class="diag-txt">'+esc(d.txt)+esc(extra)+'</div>';
}

function accionCell(row){
  var clave=esc(row.clave), itemId=esc(itemIdOf(row)), btn;
  if(row.accion==='reactivar')        btn='<button class="btn mini" onclick="reactivarUno(this,\''+clave+'\',\''+itemId+'\')">Reactivar</button>';
  else if(row.accion==='desvincular') btn='<button class="btn mini sec" onclick="desvincularClave(this,\''+clave+'\')">Desvincular</button>';
  else if(row.accion==='descartar')   btn='<button class="btn mini sec" onclick="descartar(this,\''+clave+'\')">Descartar</button>';
  else if(row.accion==='reintentar')  btn='<button class="btn mini" onclick="reintentar(this,\''+clave+'\')">Reintentar</button>';
  else btn='<button class="btn mini" onclick="reintentar(this,\''+clave+'\')">Reintentar</button> <button class="btn mini sec" onclick="descartar(this,\''+clave+'\')">Descartar</button>';
  return '<div class="acc-btns">'+btn+'</div><span class="st"></span>';
}

function stDe(btn){return btn.closest('td').querySelector('.st');}

async function reactivarUno(btn,clave,itemId){
  var st=stDe(btn);btn.disabled=true;st.className='st';st.textContent='Reactivando…';
  try{
    var r=await fetch('/api/sync/reactivar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({itemIds:[itemId]})});
    var d=await r.json();
    if(!d.ok)throw new Error(d.error||'error');
    var res=(d.resultados||[])[0]||{};
    if(res.ok){st.className='st ok';st.textContent='✓ Reactivada';btn.closest('tr').classList.add('row-done');}
    else if(res.bloqueado&&res.neto!=null&&res.precio_web!=null){st.className='st bad';st.textContent='✗ Bloqueada: neto $'+n(Math.round(res.neto))+' vs contado $'+n(res.precio_web)+' ('+Math.round(res.deficitPct*100)+'% abajo). Corregí el precio en ML.';btn.disabled=false;}
    else if(res.bloqueado){st.className='st bad';st.textContent='✗ Bloqueada: '+(res.error||'no se pudo verificar el precio')+'.';btn.disabled=false;}
    else{st.className='st bad';st.textContent='✗ '+(res.error||'no se pudo reactivar');btn.disabled=false;}
  }catch(e){st.className='st bad';st.textContent='✗ '+e.message;btn.disabled=false;}
}

async function desvincularClave(btn,clave){
  if(!confirm('Se va a borrar el mapeo de esta publicación para que la vuelvas a linkear desde el Matcher. ¿Confirmás?'))return;
  var st=stDe(btn);btn.disabled=true;st.className='st';st.textContent='Desvinculando…';
  try{
    var r=await fetch('/api/sync/desvincular',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clave:clave})});
    var d=await r.json();
    if(!d.ok)throw new Error(d.error||'error');
    st.className='st ok';st.textContent='✓ Desvinculada — re-mapeala en el Matcher';btn.closest('tr').classList.add('row-done');
  }catch(e){st.className='st bad';st.textContent='✗ '+e.message;btn.disabled=false;}
}

async function descartar(btn,clave){
  var st=stDe(btn);btn.disabled=true;st.className='st';st.textContent='Descartando…';
  try{
    var r=await fetch('/api/sync/descartar-error',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({claves:[clave]})});
    var d=await r.json();
    if(!d.ok)throw new Error(d.error||'error');
    st.className='st ok';st.textContent='✓ Descartada';btn.closest('tr').classList.add('row-done');
  }catch(e){st.className='st bad';st.textContent='✗ '+e.message;btn.disabled=false;}
}

async function asignar(tr,clave,sku,nombre){
  // Modo mapeo tiene .estado-cell; en errores usamos el .st de la celda de Acción.
  var cell=tr.querySelector('.estado-cell');
  var st=tr.querySelector('.st');
  function marcar(txt,cls){
    if(cell){cell.innerHTML='<span class="st '+(cls||'')+'">'+txt+'</span>';}
    else if(st){st.className='st '+(cls||'');st.innerHTML=txt;}
  }
  marcar('Asignando…','');
  try{
    var body={decisiones:{}};
    body.decisiones[clave]={sku:sku,wc_nombre:nombre||null,accion:'asignar'};
    var r=await fetch('/api/matcher/decisiones',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var d=await r.json();
    if(!d.ok)throw new Error(d.error||'error');
    tr.classList.add('row-done');
    var box=tr.querySelector('.sku-box');
    if(box)box.innerHTML='<span class="tag ok">✓ '+esc(sku)+'</span>';
    marcar('✓ Asignado','ok');
  }catch(err){
    marcar('✗ '+esc(err.message),'bad');
  }
}

// ── Modo reintentar: re-push de stock de un ítem ─────────────────────────────
async function reintentar(btn,clave){
  var st=btn.closest('td').querySelector('.st');
  btn.disabled=true;st.className='st';st.textContent='Reintentando…';
  try{
    var r=await fetch('/api/sync/reintentar-item',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clave:clave})});
    var d=await r.json();
    if(d.ok){
      st.className='st ok';st.textContent='✓ Stock '+n(d.cantidad)+' enviado';
      btn.closest('tr').classList.add('row-done');
    }else{
      st.className='st bad';st.textContent='✗ '+d.error;btn.disabled=false;
    }
  }catch(err){
    st.className='st bad';st.textContent='✗ '+err.message;btn.disabled=false;
  }
}
</script>

<script>
(function(){
  var seg = (location.pathname.match(/\/herramientas\/([a-z0-9-]+)\//)||[])[1] || '';
  var tool = seg === 'sync-detalle' ? 'sync-ml' : seg;
  fetch('/api/auth/me').then(function(r){
    return r.json();
  }).then(function(d){
    if (!d || !d.ok) return;
    var isAdmin = !!d.is_admin || (d.scopes && d.scopes.indexOf('all') !== -1);
    if (isAdmin || !tool) return;
    var ok = (d.permisos||[]).some(function(p){ return p.herramienta === tool; });
    if (!ok) location.href = '/herramientas/home/';
  }).catch(function(){});
})();
</script>
