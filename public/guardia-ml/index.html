<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guardia ML — Fusion Bikes</title><link rel="stylesheet" href="../lib/theme.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--border);padding:.75rem 1rem;display:flex;gap:.75rem;align-items:center}.top h1{font-size:1rem;margin:0;flex:1}.top a,.btn{color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.55rem .7rem;text-decoration:none;font:inherit;cursor:pointer;min-height:44px}.wrap{max-width:1100px;margin:auto;padding:1rem}.status{border:1px solid var(--border);border-radius:10px;padding:.85rem;margin-bottom:1rem;background:var(--surface)}.status.sano{border-color:var(--success)}.status.degradado{border-color:var(--warning)}.layout{display:grid;grid-template-columns:minmax(260px,40%) 1fr;gap:1rem}.queue,.detail{background:var(--surface);border:1px solid var(--border);border-radius:10px}.queue{max-height:72vh;overflow:auto}.case{width:100%;border:0;border-bottom:1px solid var(--border);background:transparent;color:inherit;text-align:left;padding:.8rem;cursor:pointer}.case:hover,.case.active{background:var(--surface2)}.case strong,.case small{display:block}.case small{color:var(--muted);margin-top:.25rem}.badge{display:inline-block;padding:.12rem .4rem;border-radius:99px;font-size:.72rem;background:var(--warning-dim);color:var(--warning)}.detail{padding:1rem;min-height:260px}.detail h2{font-size:1.05rem;margin:.2rem 0}.muted{color:var(--muted)}.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}.error{color:var(--danger)}@media(max-width:700px){.layout{grid-template-columns:1fr}.queue{max-height:none}.top{padding:.55rem}.wrap{padding:.75rem}}
</style></head><body>
<header class="top"><a href="../matcher/">← Matcher</a><h1>Guardia ML</h1><button class="btn" id="scan">Actualizar lectura</button></header><main class="wrap"><section id="status" class="status">Cargando estado…</section><div class="layout"><section id="queue" class="queue" aria-label="Cola priorizada"></section><section id="detail" class="detail"><p class="muted">Elegí un caso para ver riesgo y próxima acción.</p></section></div><section class="detail" style="margin-top:1rem"><h2>Ventas retenidas</h2><p class="muted">Pedidos ML sin vínculo exacto. No se modifican en Woo hasta una liberación humana.</p><div id="held">Cargando…</div></section></main>
<script>
const $=s=>document.querySelector(s);let casos=[],retenidos=[],actual=null,modo='lectura';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt){const r=await fetch('/api/guardia-ml'+url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo completar la acción');return d}
function pintarEstado(s){const el=$('#status');el.className='status '+(s.degradado?'degradado':s.sano?'sano':'');el.innerHTML='<strong>'+ (s.sano?'Guardia sana':s.degradado?'Guardia degradada':'Guardia requiere atención')+'</strong><div class="muted">Urgentes: '+s.urgentes+' · último escaneo: '+esc(s.ultimo_scan_exitoso_en||'sin lectura completa')+' · modo: '+esc(s.modo)+'</div>'}
function pintarRetenidos(){const h=$('#held');if(!retenidos.length){h.innerHTML='<p class="muted">No hay ventas retenidas.</p>';return}h.innerHTML=retenidos.map(p=>'<div class="case"><strong>Pedido ML '+esc(p.ml_order_id)+'</strong><small>'+esc(p.motivo)+' · desde '+esc(p.creado_en)+'</small><div class="actions">'+(modo==='acciones'?'<button class="btn" data-release="'+esc(p.ml_order_id)+'">Liberar</button><button class="btn" data-cancel="'+esc(p.ml_order_id)+'">Cancelar</button>':'<span class="muted">Modo lectura</span>')+'</div></div>').join('');h.querySelectorAll('[data-release]').forEach(b=>b.onclick=()=>salirRetencion(b.dataset.release,'liberar'));h.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>salirRetencion(b.dataset.cancel,'cancelar'))}
async function salirRetencion(id,accion){const motivo=prompt('Motivo obligatorio');if(!motivo)return;try{await api('/pedidos-retenidos/'+encodeURIComponent(id)+'/'+accion,{method:'POST',body:JSON.stringify({motivo})});await cargar()}catch(e){alert(e.message)}}
function pintar(){const q=$('#queue');if(!casos.length){q.innerHTML='<p class="muted" style="padding:1rem">No hay casos abiertos.</p>';$('#detail').innerHTML='<p class="muted">No hay variantes vendibles sin cobertura.</p>';return}q.innerHTML=casos.map(c=>'<button class="case '+(actual?.id===c.id?'active':'')+'" data-id="'+c.id+'"><span class="badge">'+esc(c.severidad)+'</span><strong>'+esc(c.titulo)+'</strong><small>'+esc(c.variations_texto||'Sin variante')+' · Stock ML '+esc(c.available_quantity)+' · '+esc(c.estado)+'</small></button>').join('');q.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{actual=casos.find(c=>c.id===Number(b.dataset.id));pintar()});if(!actual)actual=casos[0];const c=actual;const acciones=modo==='acciones'?'<label for="sku">SKU Woo exacto</label><input id="sku" placeholder="FB-..." aria-label="SKU Woo exacto"><button class="btn" id="link">Vincular</button><button class="btn" id="pause">Pausar publicación</button>':'<p class="muted">Modo lectura: las acciones que escriben en ML permanecen bloqueadas hasta validación administrativa.</p>';$('#detail').innerHTML='<p class="badge">'+esc(c.severidad)+'</p><h2>'+esc(c.titulo)+'</h2><p class="muted">'+esc(c.variations_texto||'Sin variante')+'</p><p><b>Riesgo:</b> '+esc(c.motivo)+'<br><b>Stock ML:</b> '+esc(c.available_quantity)+' · <b>Ventas 30d:</b> '+esc(c.ventas_30d)+'<br><b>Responsable:</b> '+esc(c.responsable||'sin asignar')+'</p><p><a href="'+esc(c.permalink||'#')+'" target="_blank" rel="noopener">Abrir publicación ML</a></p><div class="actions"><button class="btn" id="take">Tomar caso</button>'+acciones+'</div>';pintarEventos(c.id);$('#take').onclick=async()=>{try{await api('/casos/'+c.id+'/tomar',{method:'POST',body:'{}'});await cargar()}catch(e){alert(e.message)}};if(modo==='acciones'){$('#link').onclick=async()=>{try{await api('/casos/'+c.id+'/vincular',{method:'POST',body:JSON.stringify({sku:$('#sku').value})});await cargar()}catch(e){alert(e.message)}};$('#pause').onclick=async()=>{if(!confirm('La pausa afecta toda la publicación y sus variantes. ¿Confirmar?'))return;try{await api('/casos/'+c.id+'/pausar',{method:'POST',body:JSON.stringify({confirmado:true})});await cargar()}catch(e){alert(e.message)}}}}
async function pintarEventos(id){try{const r=await api('/casos/'+id+'/eventos');const rows=r.data||[];const el=document.createElement('details');el.innerHTML='<summary>Historial ('+rows.length+')</summary>'+rows.map(x=>'<div class="muted" style="margin:.4rem 0">'+esc(x.creado_en)+' · '+esc(x.evento)+' · '+esc(x.actor||'sistema')+'</div>').join('');$('#detail').appendChild(el)}catch(_){}}
async function cargar(){try{const [e,l,p]=await Promise.all([api('/estado'),api('/casos'),api('/pedidos-retenidos')]);modo=e.data.modo||l.modo||'lectura';pintarEstado(e.data);casos=l.data;retenidos=p.data;if(actual)actual=casos.find(c=>c.id===actual.id)||null;pintar();pintarRetenidos()}catch(e){$('#status').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}
$('#scan').onclick=async()=>{try{$('#scan').disabled=true;await api('/escanear',{method:'POST',body:'{}'});await cargar()}catch(e){alert(e.message)}finally{$('#scan').disabled=false}};cargar();
</script></body></html>
