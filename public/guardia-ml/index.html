<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Guardia ML — Fusion Bikes</title>
  <link rel="stylesheet" href="../lib/theme.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:.7rem;padding:.7rem 1rem;background:var(--surface);border-bottom:1px solid var(--border)}.top h1{margin:0;font-size:1rem;flex:1}.btn,.top a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.52rem .7rem;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font:inherit;text-decoration:none;cursor:pointer}.btn:disabled{cursor:not-allowed;opacity:.55}.wrap{max-width:1440px;margin:auto;padding:1rem}.health{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.8rem;padding:.8rem;border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:1rem}.health.bad{border-color:var(--danger)}.health.warn{border-color:var(--warning)}.health strong,.muted{display:block}.muted{color:var(--muted);font-size:.88rem}.tabs{display:flex;gap:.45rem;overflow:auto;padding-bottom:.6rem;margin-bottom:.4rem}.tab{white-space:nowrap;background:transparent}.tab.active{border-color:var(--success);background:var(--success-dim)}.view{display:grid;grid-template-columns:minmax(275px,31%) 1fr;gap:1rem}.card{background:var(--surface);border:1px solid var(--border);border-radius:10px}.side{max-height:72vh;overflow:auto}.card-head{padding:.75rem .85rem;border-bottom:1px solid var(--border)}.case{width:100%;padding:.75rem .85rem;border:0;border-bottom:1px solid var(--border);background:transparent;color:inherit;text-align:left;cursor:pointer}.case:hover,.case.active{background:var(--surface2)}.case strong{display:block;font-size:.92rem}.case small{display:block;margin-top:.22rem;color:var(--muted)}.tag{display:inline-block;padding:.12rem .42rem;border-radius:99px;background:var(--warning-dim);color:var(--warning);font-size:.72rem}.tag.critical{background:var(--danger-dim);color:var(--danger)}.detail{padding:1rem;min-height:380px}.detail h2{font-size:1.08rem;margin:.15rem 0 .35rem}.actionbar{display:flex;gap:.5rem;flex-wrap:wrap;margin:.7rem 0}.compare{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.panel{padding:.85rem;border:1px solid var(--border);border-radius:9px;background:var(--surface2)}.panel h3{margin:.1rem 0 .75rem;font-size:.94rem}.product{display:flex;gap:.8rem;align-items:flex-start}.photo{width:108px;height:108px;flex:0 0 auto;object-fit:contain;border:1px solid var(--border);border-radius:8px;background:var(--surface)}.placeholder{display:grid;place-items:center;color:var(--muted);font-size:.8rem}.facts{font-size:.88rem;line-height:1.55}.facts b{color:var(--text)}.risk{margin-top:.75rem;padding:.65rem;border-radius:8px;background:var(--warning-dim);font-size:.88rem}.risk.critical{background:var(--danger-dim)}.search{display:flex;gap:.5rem;margin-bottom:.7rem}.search input{min-width:0;flex:1;padding:.6rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}.option{display:grid;grid-template-columns:58px 1fr auto;gap:.65rem;align-items:center;padding:.55rem;margin:.45rem 0;border:1px solid var(--border);border-radius:8px;background:var(--surface)}.option.selected{border-color:var(--success);outline:2px solid color-mix(in srgb,var(--success) 24%,transparent)}.option img,.option .placeholder{width:58px;height:58px}.option strong{display:block;overflow-wrap:anywhere}.option small{color:var(--muted);font-size:.8rem}.options{max-height:390px;overflow:auto}.empty{padding:1rem}.split{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.table{width:100%;border-collapse:collapse;font-size:.88rem}.table th,.table td{padding:.6rem;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}.history{margin-top:1rem}.history summary{cursor:pointer}.history div{padding:.35rem 0;border-bottom:1px solid var(--border)}.error{color:var(--danger)}.notice{padding:.75rem;border-radius:8px;background:var(--warning-dim);font-size:.88rem}.modal{position:fixed;inset:0;z-index:10;background:color-mix(in srgb,#000 55%,transparent);display:grid;place-items:center;padding:1rem}.modal[hidden]{display:none}.modal>section{width:min(520px,100%);padding:1rem;background:var(--surface);border:1px solid var(--border);border-radius:12px}.modal label{display:block;margin:.75rem 0 .25rem}.modal textarea,.modal select{width:100%;padding:.6rem;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font:inherit}.right{text-align:right}@media(max-width:850px){.health{grid-template-columns:1fr}.view,.compare,.split{grid-template-columns:1fr}.side{max-height:none}.photo{width:90px;height:90px}.top{padding:.55rem}.wrap{padding:.75rem}.option{grid-template-columns:52px 1fr}.option .btn{grid-column:2}.option img,.option .placeholder{width:52px;height:52px}}
  </style>
</head>
<body>
  <header class="top"><a href="../matcher/">← Consulta legacy</a><h1>Guardia ML</h1><button class="btn" id="refresh">Actualizar lectura</button></header>
  <main class="wrap">
    <section id="health" class="health" aria-live="polite">Cargando estado de cobertura…</section>
    <nav class="tabs" role="tablist" aria-label="Intención de trabajo">
      <button class="btn tab active" role="tab" aria-selected="true" data-view="resolver">Resolver ahora</button><button class="btn tab" role="tab" aria-selected="false" data-view="investigar">Investigar</button><button class="btn tab" role="tab" aria-selected="false" data-view="catalogo">Corregir catálogo</button><button class="btn tab" role="tab" aria-selected="false" data-view="cobertura">Auditar cobertura</button><button class="btn tab" role="tab" aria-selected="false" data-view="historial">Decisiones previas</button>
    </nav>
    <section id="app" aria-live="polite"></section>
  </main>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden><section><h2 id="modal-title">Confirmar</h2><div id="modal-body"></div><div class="actionbar right"><button class="btn" id="modal-cancel">Cancelar</button><button class="btn" id="modal-ok">Confirmar</button></div></section></div>
  <script>
    const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let state={casos:[],held:[],health:null,actual:null,view:'resolver',modo:'lectura',opciones:[],publicacion:null,events:[]};
    const api=async(url,opt={})=>{const r=await fetch('/api/guardia-ml'+url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'No se pudo completar la acción');return d};
    const stock=n=>Number(n)>=99999?'Atípico / ilimitado':esc(n??'sin dato');
    const image=(url,name)=>url?'<img class="photo" src="'+esc(url)+'" alt="'+esc(name||'Producto')+'">':'<div class="photo placeholder">Sin foto</div>';
    const sev=c=>'<span class="tag '+(c.severidad==='critico'?'critical':'')+'">'+esc(c.severidad)+'</span>';
    const selected=()=>state.actual&&state.casos.find(c=>c.id===state.actual.id);
    function health(){const h=state.health||{},el=$('#health'),txt=h.sano?'Guardia sana':h.degradado?'Guardia degradada':'Guardia requiere atención';el.className='health '+(h.sano?'':' '+(h.degradado?'warn':'bad'));el.innerHTML='<strong>'+txt+'</strong><span class="muted">Urgentes: '+esc(h.urgentes||0)+' · Último escaneo completo: '+esc(h.ultimo_scan_exitoso_en||'sin lectura confiable')+' · Acciones: '+esc(state.modo)+'</span><span class="muted">Una lectura local no confirma MercadoLibre.</span>'}
    function queue(title,items,empty='No hay casos para esta vista.') {return '<aside class="card side"><div class="card-head"><strong>'+title+'</strong><span class="muted">'+items.length+' caso(s)</span></div>'+ (items.length?items.map(c=>'<button class="case '+(selected()?.id===c.id?'active':'')+'" data-case="'+c.id+'">'+sev(c)+'<strong>'+esc(c.titulo)+'</strong><small>'+esc(c.variations_texto||'Sin variante')+' · Stock ML: '+stock(c.available_quantity)+' · '+esc(c.estado)+'</small></button>').join(''):'<p class="muted empty">'+empty+'</p>')+'</aside>'}
    function bindCases(){document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{state.actual=state.casos.find(c=>c.id===Number(b.dataset.case));state.opciones=[];state.publicacion=null;state.events=[];render()})}
    async function loadDetail(){const c=selected();if(!c)return;try{const [o,e]=await Promise.all([api('/casos/'+c.id+'/opciones'),api('/casos/'+c.id+'/eventos')]);state.publicacion=o.data.publicacion;state.opciones=o.data.opciones||[];state.events=e.data||[];render()}catch(err){$('#detail').innerHTML='<p class="error">'+esc(err.message)+'</p>'}}
    function takeButton(c){return '<button class="btn" id="take">'+(c.responsable?'Solicitar relevo / tomar':'Tomar caso')+'</button>'}
    function itemPanel(p,c){return '<section class="panel"><h3>MercadoLibre · fuente</h3><div class="product">'+image(p.thumbnail,p.titulo)+'<div class="facts"><b>'+esc(p.titulo)+'</b><br>Publicación: '+esc(p.item_id)+'<br>Variación: '+esc(p.variation_id||'sin variación')+'<br>SKU remoto: '+esc(p.seller_sku||'sin SKU')+'<br>Stock informado: '+stock(p.available_quantity)+'<br>Estado: '+esc(p.status)+'<br>Precio: '+esc(p.precio||'sin dato')+'<br><a href="'+esc(p.permalink||'#')+'" target="_blank" rel="noopener">Abrir en MercadoLibre</a></div></div><div class="risk '+(c.severidad==='critico'?'critical':'')+'"><b>Qué requiere ahora:</b> '+esc(c.motivo)+'. La cobertura sólo se confirma cuando ML y Woo sostienen el mismo SKU único.</div></section>'}
    function wooPanel(){const cs=state.opciones;const disabled=state.modo!=='acciones'?' disabled':'';return '<section class="panel"><h3>WooCommerce · decisión humana</h3><div class="search"><input id="search" name="woo-search" autocomplete="off" placeholder="SKU o nombre" aria-label="Buscar en Woo"><button class="btn" id="find">Buscar</button></div><div class="options">'+(cs.length?cs.map(o=>'<article class="option"><div>'+image(o.img,o.nombre)+'</div><div><strong>'+esc(o.nombre)+'</strong><small>SKU '+esc(o.sku)+' · Stock Woo '+esc(o.stock??'sin dato')+(o.marca?' · '+esc(o.marca):'')+(o.tipo?' · '+esc(o.tipo):'')+'</small></div><button class="btn" data-sku="'+esc(o.sku)+'"'+disabled+'>Elegir</button></article>').join(''):'<p class="muted">Sin candidato automático. Buscá por SKU o nombre; la ausencia es una tarea de catálogo, no una excepción.</p>')+'</div><p class="muted" id="write-help">'+(state.modo==='acciones'?'Las acciones requieren confirmación humana y quedan auditadas.':'Modo lectura: podés investigar, pero las escrituras ML están deshabilitadas.')+'</p></section>'}
    function detailResolver(){const c=selected();if(!c)return '<section class="card detail"><h2>Resolver ahora</h2><p class="muted">Elegí una alerta. Esta vista prioriza ventas retenidas y casos críticos, no el backlog entero.</p></section>';const p=state.publicacion;if(!p){setTimeout(loadDetail,0);return '<section id="detail" class="card detail"><p class="muted">Cargando contexto verificable…</p></section>'}return '<section id="detail" class="card detail">'+sev(c)+'<h2>'+esc(c.titulo)+'</h2><span class="muted">Responsable: '+esc(c.responsable||'sin asignar')+' · Caso '+c.id+'</span><div class="actionbar">'+takeButton(c)+(state.modo==='acciones'?'<button class="btn" id="pause">Pausar ML</button>':'<span class="notice">Modo lectura: comparar está permitido; escribir en MercadoLibre no.</span>')+'</div><div class="compare">'+itemPanel(p,c)+wooPanel()+'</div><details class="history"><summary>Historia y cambios ('+state.events.length+')</summary>'+state.events.map(e=>'<div class="muted">'+esc(e.creado_en)+' · '+esc(e.evento)+' · '+esc(e.actor||'sistema')+'</div>').join('')+'</details></section>'}
    function urgentCases(){return state.casos.filter(c=>c.severidad==='critico'||c.severidad==='urgente'||c.pedido_ml_order_id||c.estado==='tomado')}
    function bloqueRetenidas(){if(!state.held.length)return '';return '<section class="card detail" style="border-color:#F5B942"><h2>Ventas retenidas ('+state.held.length+')</h2><p class="muted">Ventas pagas que no llegan a Woo, preparación ni despacho hasta que alguien las libere. Liberar no escribe en MercadoLibre: la próxima importación crea el pedido.</p><table class="table"><thead><tr><th>Pedido</th><th>Motivo</th><th>Desde</th><th></th></tr></thead><tbody>'+state.held.map(h=>'<tr><td>'+esc(h.ml_order_id)+'</td><td>'+esc(h.motivo)+'</td><td>'+esc(String(h.creado_en).slice(0,16).replace('T',' '))+'</td><td><button class="btn" data-release="'+esc(h.ml_order_id)+'">Liberar</button></td></tr>').join('')+'</tbody></table></section>'}
    function renderResolver(){return '<div class="view">'+bloqueRetenidas()+queue('Prioridad operativa',urgentCases(),'No hay urgencias abiertas.')+detailResolver()+'</div>'}
    function renderInvestigate(){const c=selected()||state.casos[0];if(c&&!state.actual){state.actual=c;setTimeout(render,0)}return '<div class="view">'+queue('Casos para investigar',state.casos,'No hay divergencias abiertas.')+'<section class="card detail">'+(c?'<h2>Investigar antes de cambiar</h2><p class="muted">Este modo no ofrece una acción rápida: compara la evidencia, las variantes hermanas y la historia antes de que alguien asuma responsabilidad.</p>'+detailResolver().replace('<section id="detail" class="card detail">','').replace(/<\/section>$/,''):'<h2>Sin investigación pendiente</h2><p class="muted">Una Guardia sana no significa que el stock compartido sea una reserva atómica; significa que cada variante activa tiene identidad comprobable.</p>')+'</section></div>'}
    function renderCatalog(){const items=state.casos.filter(c=>/sku|cat[aá]logo|inexistente/i.test(c.motivo||'')||!c.seller_sku);const c=selected();if(c&&!state.publicacion)setTimeout(loadDetail,0);const detail=c?(state.publicacion?'<div class="compare">'+itemPanel(state.publicacion,c)+wooPanel()+'</div>':'<p class="muted">Cargando datos verificables de ML y Woo…</p>'):'<p class="muted">No hay caso seleccionado.</p>';return '<div class="view">'+queue('Faltan datos de catálogo',items,'No hay casos sin identidad detectados.')+'<section class="card detail"><h2>Corregir catálogo</h2><p class="muted">Usá esta vista cuando no existe un SKU Woo o los candidatos son ambiguos. No es un error que se “ignore”: se completa catálogo, se vuelve a buscar y recién entonces se vincula.</p><div class="notice">Una publicación activa sin SKU no se considera cubierta aunque su título se parezca a un producto. La herramienta deja trazabilidad de la búsqueda y evita inventar una asociación.</div><div id="catalog-detail">'+detail+'</div></section></div>'}
    function renderCoverage(){const rows=state.casos;return '<section class="card detail"><h2>Auditar cobertura</h2><p class="muted">Lectura masiva para entender exposición y distribuir trabajo; no reemplaza la resolución individual por variante.</p><div class="split"><div class="panel"><h3>Exposición actual</h3><p><b>'+rows.length+'</b> casos abiertos · <b>'+rows.filter(c=>c.severidad==='critico'||c.severidad==='urgente').length+'</b> urgentes · <b>'+state.held.length+'</b> ventas retenidas</p><button class="btn" id="go-urgent">Resolver urgencias</button></div><div class="panel"><h3>Regla de cobertura</h3><p class="muted">SKU Woo único + <code>seller_sku</code> ML igual + stock reconciliado. Cualquier divergencia vuelve a Guardia.</p></div></div><table class="table"><thead><tr><th>Publicación / variante</th><th>Riesgo</th><th>Stock ML</th><th>Estado</th><th></th></tr></thead><tbody>'+rows.map(c=>'<tr><td><b>'+esc(c.titulo)+'</b><br><span class="muted">'+esc(c.variations_texto||'sin variante')+'</span></td><td>'+sev(c)+'</td><td>'+stock(c.available_quantity)+'</td><td>'+esc(c.estado)+'</td><td><button class="btn" data-audit="'+c.id+'">Abrir</button></td></tr>').join('')+'</tbody></table></section>'}
    function renderHistory(){return '<div class="split"><section class="card detail"><h2>Ventas retenidas</h2><p class="muted">No llegan a Woo, preparación ni despacho hasta que una persona valide la identidad y libere el pedido.</p>'+ (state.held.length?'<table class="table"><thead><tr><th>Pedido</th><th>Motivo</th><th>Desde</th><th></th></tr></thead><tbody>'+state.held.map(h=>'<tr><td>'+esc(h.ml_order_id)+'</td><td>'+esc(h.motivo)+'</td><td>'+esc(h.creado_en)+'</td><td>'+'<button class="btn" data-release="'+esc(h.ml_order_id)+'">Liberar</button>'+'</td></tr>').join('')+'</tbody></table>':'<p class="muted">No hay ventas retenidas.</p>')+'</section><section class="card detail"><h2>Cómo aprende el matcher</h2><p class="muted">Las decisiones confirmadas quedan auditadas y pueden mejorar el orden de candidatos futuros. Nunca convierten una coincidencia aproximada en vínculo automático: la única auto-confirmación permitida es SKU exacto y único.</p><p class="notice">Esta vista conservará decisiones, cambios remotos y operaciones pendientes; la historia no se reescribe cuando se corrige un vínculo.</p></section></div>'}
    function render(){health();let html=state.view==='resolver'?renderResolver():state.view==='investigar'?renderInvestigate():state.view==='catalogo'?renderCatalog():state.view==='cobertura'?renderCoverage():renderHistory();$('#app').innerHTML=html;bindCases();bindActions()}
    async function find(){const q=$('#search')?.value.trim()||'';if(!selected())return;try{const r=await api('/casos/'+selected().id+'/opciones'+(q?'?q='+encodeURIComponent(q):''));state.opciones=r.data.opciones||[];render()}catch(e){alert(e.message)}}
    function modal(title,body,ok){$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;$('#modal').hidden=false;$('#modal-cancel').onclick=()=>$('#modal').hidden=true;$('#modal-ok').onclick=async()=>{try{await ok();$('#modal').hidden=true;await load()}catch(e){alert(e.message)}}}
    function bindActions(){document.querySelectorAll('[data-sku]').forEach(b=>b.onclick=()=>{if(state.modo!=='acciones')return alert('Guardia está en modo lectura. Podés investigar, pero no escribir en MercadoLibre.');const c=selected(),sku=b.dataset.sku;modal('Vincular '+sku,'<p>Confirmá que el producto Woo y esta variación ML son el mismo producto. Se encolará una operación durable: ML debe confirmar el <code>seller_sku</code> y luego se reconciliará el stock.</p>',()=>api('/casos/'+c.id+'/vincular',{method:'POST',body:JSON.stringify({sku})}))});$('#find')?.addEventListener('click',find);$('#search')?.addEventListener('keydown',e=>{if(e.key==='Enter')find()});$('#take')?.addEventListener('click',async()=>{const c=selected();try{await api('/casos/'+c.id+'/tomar',{method:'POST',body:JSON.stringify(c.responsable?{motivo:'Relevo solicitado desde Guardia'}:{})});await load()}catch(e){alert(e.message)}});$('#pause')?.addEventListener('click',()=>{const c=selected();modal('Pausar publicación en MercadoLibre','<p>La pausa puede afectar variantes hermanas. Confirmá sólo si revisaste la publicación padre y la alternativa comercial.</p>',()=>api('/casos/'+c.id+'/pausar',{method:'POST',body:JSON.stringify({confirmado:true})}))});document.querySelectorAll('[data-audit]').forEach(b=>b.onclick=()=>{state.actual=state.casos.find(c=>c.id===Number(b.dataset.audit));state.view='investigar';syncTabs();render()});$('#go-urgent')?.addEventListener('click',()=>{state.view='resolver';syncTabs();render()});document.querySelectorAll('[data-release]').forEach(b=>b.onclick=()=>modal('Liberar pedido '+b.dataset.release,'<label for="reason">Motivo de liberación</label><textarea id="reason" required></textarea>',()=>{const motivo=$('#reason').value.trim();if(!motivo)throw Error('El motivo es obligatorio');return api('/pedidos-retenidos/'+encodeURIComponent(b.dataset.release)+'/liberar',{method:'POST',body:JSON.stringify({motivo})})}))}
    function syncTabs(){document.querySelectorAll('.tab').forEach(t=>{const active=t.dataset.view===state.view;t.classList.toggle('active',active);t.setAttribute('aria-selected',String(active))})}
    async function load(){try{const [h,c,r]=await Promise.all([api('/estado'),api('/casos'),api('/pedidos-retenidos')]);state.health=h.data;state.modo=h.data.modo||c.modo||'lectura';state.casos=c.data||[];state.held=r.data||[];if(state.actual&&!state.casos.some(c=>c.id===state.actual.id))state.actual=null;if(!state.actual&&state.casos.length)state.actual=state.casos[0];render()}catch(e){$('#health').innerHTML='<strong class="error">'+esc(e.message)+'</strong>'}}
    document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{state.view=t.dataset.view;syncTabs();render()});$('#refresh').onclick=async()=>{try{$('#refresh').disabled=true;await api('/escanear',{method:'POST',body:'{}'});await load()}catch(e){alert(e.message)}finally{$('#refresh').disabled=false}};load();
  </script>
</body>
</html>
