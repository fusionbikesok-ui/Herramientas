<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Guardia ML — Fusion Bikes</title>
  <link rel="stylesheet" href="../lib/theme.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .top{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--border);padding:.75rem 1rem;display:flex;gap:.75rem;align-items:center}.top h1{font-size:1rem;margin:0;flex:1}
    .top a,.btn{color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.55rem .7rem;text-decoration:none;font:inherit;cursor:pointer;min-height:44px}.btn:disabled{opacity:.55;cursor:not-allowed}
    .wrap{max-width:1250px;margin:auto;padding:1rem}.status{border:1px solid var(--border);border-radius:10px;padding:.85rem;margin-bottom:1rem;background:var(--surface)}.status.sano{border-color:var(--success)}.status.degradado{border-color:var(--warning)}
    .layout{display:grid;grid-template-columns:minmax(260px,34%) 1fr;gap:1rem}.queue,.detail{background:var(--surface);border:1px solid var(--border);border-radius:10px}.queue{max-height:76vh;overflow:auto}.case{width:100%;border:0;border-bottom:1px solid var(--border);background:transparent;color:inherit;text-align:left;padding:.8rem;cursor:pointer}.case:hover,.case.active{background:var(--surface2)}.case strong,.case small{display:block}.case small{color:var(--muted);margin-top:.25rem}
    .badge{display:inline-block;padding:.12rem .4rem;border-radius:99px;font-size:.72rem;background:var(--warning-dim);color:var(--warning)}.detail{padding:1rem;min-height:260px}.detail h2{font-size:1.05rem;margin:.2rem 0}.muted{color:var(--muted)}.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}.error{color:var(--danger)}
    .compare{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}.panel{border:1px solid var(--border);border-radius:10px;padding:.85rem;background:var(--surface2)}.panel h3{margin:.1rem 0 .75rem;font-size:.95rem}.hero{display:flex;gap:.85rem;align-items:flex-start}.hero img,.option img{width:84px;height:84px;object-fit:contain;background:var(--surface);border-radius:8px;border:1px solid var(--border)}.hero img{width:120px;height:120px}.facts{font-size:.88rem;line-height:1.55}.facts b{color:var(--text)}.atypical{color:var(--warning);font-weight:700}.search{display:flex;gap:.5rem;margin-bottom:.75rem}.search input{min-width:0;flex:1;border:1px solid var(--border);border-radius:8px;padding:.65rem;font:inherit;background:var(--surface);color:var(--text)}.option{display:flex;gap:.7rem;align-items:center;border:1px solid var(--border);border-radius:8px;padding:.55rem;margin:.5rem 0;background:var(--surface)}.option.selected{border-color:var(--success);outline:2px solid color-mix(in srgb,var(--success) 25%,transparent)}.option img{width:58px;height:58px;flex:0 0 auto}.option .body{min-width:0;flex:1}.option strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.option small{display:block;color:var(--muted);margin-top:.2rem}.option .btn{min-height:38px;padding:.4rem .55rem}.notice{padding:.65rem;border-radius:8px;background:var(--warning-dim);margin-top:.75rem;font-size:.88rem}.history{margin-top:1rem}.history div{margin:.4rem 0}.empty{padding:.8rem 0}
    @media(max-width:800px){.layout,.compare{grid-template-columns:1fr}.queue{max-height:none}.top{padding:.55rem}.wrap{padding:.75rem}.hero img{width:92px;height:92px}.option{align-items:flex-start}.option .btn{margin-left:auto}}
  </style>
</head>
<body>
  <header class="top"><a href="../matcher/">← Matcher</a><h1>Guardia ML</h1><button class="btn" id="scan">Actualizar lectura</button></header>
  <main class="wrap">
    <section id="status" class="status">Cargando estado…</section>
    <div class="layout">
      <section id="queue" class="queue" aria-label="Cola priorizada"></section>
      <section id="detail" class="detail"><p class="muted">Elegí un caso para ver la publicación y las opciones Woo.</p></section>
    </div>
    <section class="detail" style="margin-top:1rem"><h2>Ventas retenidas</h2><p class="muted">Pedidos ML sin vínculo exacto. No se modifican en Woo hasta una liberación humana.</p><div id="held">Cargando…</div></section>
  </main>
  <script>
    const $=s=>document.querySelector(s);let casos=[],retenidos=[],actual=null,modo='lectura',seleccionado='';
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const imagen=(u,alt='Imagen del producto')=>u?'<img src="'+esc(u)+'" alt="'+esc(alt)+'">':'<div class="muted">Sin imagen</div>';
    const stock=s=>Number(s)>=99999?'<span class="atypical">Ilimitado / atípico</span>':esc(s??'sin dato');
    async function api(url,opt){const r=await fetch('/api/guardia-ml'+url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'No se pudo completar la acción');return d}
    function pintarEstado(s){const el=$('#status');el.className='status '+(s.degradado?'degradado':s.sano?'sano':'');el.innerHTML='<strong>'+ (s.sano?'Guardia sana':s.degradado?'Guardia degradada':'Guardia requiere atención')+'</strong><div class="muted">Urgentes: '+s.urgentes+' · último escaneo: '+esc(s.ultimo_scan_exitoso_en||'sin lectura completa')+' · modo: '+esc(s.modo)+'</div>'}
    function pintarRetenidos(){const h=$('#held');if(!retenidos.length){h.innerHTML='<p class="muted">No hay ventas retenidas.</p>';return}h.innerHTML=retenidos.map(p=>'<div class="case"><strong>Pedido ML '+esc(p.ml_order_id)+'</strong><small>'+esc(p.motivo)+' · desde '+esc(p.creado_en)+'</small><div class="actions">'+(modo==='acciones'?'<button class="btn" data-release="'+esc(p.ml_order_id)+'">Liberar</button><button class="btn" data-cancel="'+esc(p.ml_order_id)+'">Cancelar</button>':'<span class="muted">Modo lectura</span>')+'</div></div>').join('');h.querySelectorAll('[data-release]').forEach(b=>b.onclick=()=>salirRetencion(b.dataset.release,'liberar'));h.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>salirRetencion(b.dataset.release,'cancelar'))}
    async function salirRetencion(id,accion){const motivo=prompt('Motivo obligatorio');if(!motivo)return;try{await api('/pedidos-retenidos/'+encodeURIComponent(id)+'/'+accion,{method:'POST',body:JSON.stringify({motivo})});await cargar()}catch(e){alert(e.message)}}
    function pintar(){const q=$('#queue');if(!casos.length){q.innerHTML='<p class="muted" style="padding:1rem">No hay casos abiertos.</p>';$('#detail').innerHTML='<p class="muted">No hay variantes vendibles sin cobertura.</p>';return}q.innerHTML=casos.map(c=>'<button class="case '+(actual?.id===c.id?'active':'')+'" data-id="'+c.id+'"><span class="badge">'+esc(c.severidad)+'</span><strong>'+esc(c.titulo)+'</strong><small>'+esc(c.variations_texto||'Sin variante')+' · Stock ML '+stock(c.available_quantity)+' · '+esc(c.estado)+'</small></button>').join('');q.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{actual=casos.find(c=>c.id===Number(b.dataset.id));seleccionado='';pintar()});if(!actual)actual=casos[0];pintarDetalle()}
    async function pintarDetalle(){const c=actual;if(!c)return;seleccionado='';$('#detail').innerHTML='<p class="badge">'+esc(c.severidad)+'</p><h2>'+esc(c.titulo)+'</h2><p class="muted">Cargando comparación ML ↔ Woo…</p>';try{const r=await api('/casos/'+c.id+'/opciones');const p=r.data.publicacion,opciones=r.data.opciones||[];const acciones=modo==='acciones'?'<button class="btn" id="link" disabled>Seleccioná un producto Woo</button><button class="btn" id="pause">Pausar publicación</button>':'<button class="btn" id="link" disabled>Seleccioná un producto Woo</button><div class="notice" id="link-notice">Modo lectura: la opción se puede revisar, pero vincular en MercadoLibre está bloqueado hasta habilitar acciones.</div>';$('#detail').innerHTML='<p class="badge">'+esc(c.severidad)+'</p><div class="actions" style="margin-top:.2rem"><button class="btn" id="take">'+(c.responsable?'Relevar / tomar caso':'Tomar caso')+'</button><span class="muted">Responsable: '+esc(c.responsable||'sin asignar')+'</span></div><div class="compare"><section class="panel"><h3>Publicación de MercadoLibre</h3><div class="hero">'+imagen(p.thumbnail,p.titulo)+'<div class="facts"><b>'+esc(p.titulo)+'</b><br>Variante: '+esc(p.variations_texto||'sin variante')+'<br>Item: '+esc(p.item_id)+'<br>SKU ML: '+esc(p.seller_sku||'sin SKU')+'<br>Stock informado: '+stock(p.available_quantity)+'<br>Estado: '+esc(p.status)+'<br><a href="'+esc(p.permalink||'#')+'" target="_blank" rel="noopener">Abrir publicación ML</a></div></div><div class="notice">Riesgo: '+esc(c.motivo)+'. El vínculo válido requiere un SKU Woo exacto y único.</div></section><section class="panel"><h3>Elegir producto de WooCommerce</h3><div class="search"><input id="woo-search" placeholder="Buscar por SKU o nombre" aria-label="Buscar producto Woo"><button class="btn" id="search">Buscar</button></div><div id="options">'+renderOpciones(opciones)+'</div>'+acciones+'</section></div><details class="history" id="history"><summary>Historial</summary><div class="muted">Cargando…</div></details>';$('#take').onclick=async()=>{try{await api('/casos/'+c.id+'/tomar',{method:'POST',body:JSON.stringify(c.responsable?{motivo:'Relevo solicitado desde Guardia'}:{})});await cargar()}catch(e){alert(e.message)}};$('#search').onclick=()=>buscar();$('#woo-search').onkeydown=e=>{if(e.key==='Enter')buscar()};engancharOpciones();if(modo==='acciones'){document.querySelector('#link').onclick=()=>vincular(c.id);document.querySelector('#pause').onclick=()=>pausar(c.id)}pintarEventos(c.id)}catch(e){$('#detail').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
    function renderOpciones(opciones){if(!opciones.length)return '<p class="muted empty">No encontramos opciones. Probá con otra palabra o SKU.</p>';return opciones.map(o=>'<div class="option '+(seleccionado===o.sku?'selected':'')+'"><div>'+imagen(o.img,o.nombre)+'</div><div class="body"><strong>'+esc(o.nombre)+'</strong><small>SKU: '+esc(o.sku)+' · Stock Woo: '+esc(o.stock??'sin dato')+(o.marca?' · '+esc(o.marca):'')+'</small></div><button class="btn" data-sku="'+esc(o.sku)+'">Elegir</button></div>').join('')}
    async function buscar(){if(!actual)return;const q=String($('#woo-search')?.value||'').trim();try{const r=await api('/casos/'+actual.id+'/opciones'+(q?'?q='+encodeURIComponent(q):''));$('#options').innerHTML=renderOpciones(r.data.opciones||[]);engancharOpciones()}catch(e){alert(e.message)}}
    function engancharOpciones(){document.querySelectorAll('[data-sku]').forEach(b=>b.onclick=()=>{seleccionado=b.dataset.sku;document.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',x.querySelector('[data-sku]')?.dataset.sku===seleccionado));const link=$('#link');if(!link)return;if(modo==='acciones'){link.disabled=false;link.textContent='Vincular '+seleccionado}else{link.disabled=true;link.textContent='Seleccionado: '+seleccionado+' (bloqueado)';const notice=$('#link-notice');if(notice)notice.textContent='Seleccionaste '+seleccionado+'. Para vincularlo hay que habilitar acciones de Guardia ML como Administrador.'}})}
    async function vincular(id){if(!seleccionado){alert('Elegí primero un producto Woo');return}if(!confirm('Vincular esta publicación con '+seleccionado+'?'))return;try{await api('/casos/'+id+'/vincular',{method:'POST',body:JSON.stringify({sku:seleccionado})});await cargar()}catch(e){alert(e.message)}}
    async function pausar(id){if(!confirm('La pausa puede afectar toda la publicación y sus variantes. ¿Confirmar?'))return;try{await api('/casos/'+id+'/pausar',{method:'POST',body:JSON.stringify({confirmado:true})});await cargar()}catch(e){alert(e.message)}}
    async function pintarEventos(id){try{const r=await api('/casos/'+id+'/eventos');const rows=r.data||[];const el=$('#history');if(el)el.innerHTML='<summary>Historial ('+rows.length+')</summary>'+rows.map(x=>'<div class="muted">'+esc(x.creado_en)+' · '+esc(x.evento)+' · '+esc(x.actor||'sistema')+'</div>').join('')}catch(_){} }
    async function cargar(){try{const [e,l,p]=await Promise.all([api('/estado'),api('/casos'),api('/pedidos-retenidos')]);modo=e.data.modo||l.modo||'lectura';pintarEstado(e.data);casos=l.data;retenidos=p.data;if(actual)actual=casos.find(c=>c.id===actual.id)||null;pintar();pintarRetenidos()}catch(e){$('#status').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}
    $('#scan').onclick=async()=>{try{$('#scan').disabled=true;await api('/escanear',{method:'POST',body:'{}'});await cargar()}catch(e){alert(e.message)}finally{$('#scan').disabled=false}};cargar();
  </script>
</body>
</html>
