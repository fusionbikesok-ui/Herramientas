<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sincronización ML — Fusion Bikes</title>
<link rel="stylesheet" href="../lib/theme.css">
<link rel="stylesheet" href="../lib/components.css">
<style>
:root{--gutter:clamp(12px,3vw,32px);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--shadow-pop:0 12px 32px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

.wrap{max-width:1080px;margin:0 auto;padding:0 var(--gutter) 96px}
.crumb{font-size:var(--fs-meta);color:var(--muted)}.crumb a{display:inline-flex;align-items:center;min-height:var(--tap-min);color:var(--muted)}.crumb a:hover{color:var(--accent)}
.head{display:flex;align-items:center;gap:.75rem;justify-content:space-between;padding:0 0 .75rem}
.head h1{font-size:var(--fs-titulo);margin:0;min-width:0}
.tools{display:flex;gap:.5rem;flex:0 0 auto}
.menuwrap{position:relative}
.iconbtn{height:var(--tap-min);min-width:var(--tap-min);padding:0 .8rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;color:var(--txt);display:inline-flex;align-items:center;justify-content:center;gap:.4rem;white-space:nowrap}
.iconbtn:hover{border-color:var(--border2)}
.iconbtn:disabled{opacity:.55;cursor:default}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;width:300px;max-width:calc(100vw - 2*var(--gutter));background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:.35rem;box-shadow:var(--shadow-pop)}
.menu button{display:flex;flex-direction:column;align-items:flex-start;width:100%;min-height:var(--tap-min);padding:.5rem .7rem;background:none;border:0;border-radius:6px;text-align:left;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--surface2)}
.menu small{color:var(--muted);font-size:var(--fs-meta)}
.menu hr{border:0;border-top:1px solid var(--border);margin:.3rem 0}

.status{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.25rem;padding:.85rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1.5rem}
.status .big{display:flex;align-items:flex-start;gap:.6rem;font-weight:600;flex:1 1 280px;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;margin-top:.4rem;background:var(--muted2)}
.dot.ok{background:var(--green)}.dot.warn{background:var(--amber)}.dot.bad{background:var(--red)}
.status .big small{display:block;font-weight:400;color:var(--muted);font-size:var(--fs-meta)}
.status .big a{display:inline-flex;align-items:center;min-height:var(--tap-min)}
.flows{display:flex;flex-wrap:wrap;gap:.3rem 1.25rem;font-size:var(--fs-meta);color:var(--muted)}
.flows span{white-space:nowrap}
.flows b{color:var(--txt);font-weight:600}
.flows .bad b{color:var(--red)}

h2.sec{font-size:var(--fs-label);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 .5rem;font-weight:600}
.inc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:clip;margin-bottom:1.75rem}
.it{border-top:1px solid var(--border)}.it:first-child{border-top:0}
.ih{display:grid;grid-template-columns:4px 56px minmax(0,1fr) auto;align-items:center;column-gap:.85rem;width:100%;min-height:64px;padding:.6rem 1rem .6rem 0;background:none;border:0;text-align:left;cursor:pointer;color:inherit;text-decoration:none!important}
.ih:hover{background:var(--surface2)}
.ih .bar{align-self:stretch;border-radius:0 3px 3px 0}
.sev-crit .bar{background:var(--red)}.sev-warn .bar{background:var(--amber)}.sev-info .bar{background:var(--accent)}
.ih .n{font-size:1.5rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.sev-crit .n{color:var(--red)}.sev-warn .n{color:var(--amber)}.sev-info .n{color:var(--accent)}
.ih .tx{min-width:0}
.ih .t{display:block;font-weight:600;font-size:var(--fs-dato)}
.ih .d{display:block;color:var(--muted);font-size:var(--fs-meta)}
.ih .go{color:var(--accent);font-size:.88rem;white-space:nowrap;display:flex;align-items:center;gap:.35rem}
.ih .chev{transition:transform .15s}
.ih[aria-expanded="true"] .chev{transform:rotate(180deg)}
.ib{padding:0 1rem 1rem calc(4px + 56px + 1.7rem)}
.ok-line{display:flex;flex-wrap:wrap;gap:.3rem 1rem;padding:.75rem 1rem;color:var(--muted);font-size:var(--fs-meta);border-top:1px solid var(--border)}
.ok-line:first-child{border-top:0}
.ok-line span{white-space:nowrap}
.ok-line span::before{content:"✓ ";color:var(--green)}
.allok{display:flex;align-items:center;gap:.6rem;padding:1rem;font-weight:600}
.allok .dot{margin:0}

.mr{display:grid;grid-template-columns:44px 56px minmax(0,1fr) auto;align-items:center;column-gap:.75rem;padding:.5rem 0;border-top:1px solid var(--border)}
.mr:first-child{border-top:0}
.mr.noc,.mr--f{grid-template-columns:56px minmax(0,1fr) auto}
.mr input{width:18px;height:18px;accent-color:var(--accent);margin:0;cursor:pointer}
.cbx{display:flex;align-items:center;justify-content:center;width:44px;height:44px;cursor:pointer}
.ph{width:56px;height:56px;border-radius:6px;background:var(--surface2);display:grid;place-items:center;color:var(--muted2);overflow:hidden}
.ph svg{width:28px;height:28px;opacity:.6}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.mr .tt{min-width:0}
.mr .tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}
.mr .tt span{color:var(--muted);font-size:var(--fs-meta);display:block;overflow-wrap:anywhere}
.mr .tt .warn{color:var(--amber)}.mr .tt .bad{color:var(--red)}
.cambio{font-family:var(--mono)}
.cambio s{color:var(--muted)}.cambio em{font-style:normal;color:var(--amber);font-weight:700}
.mr .v{text-align:right;font-size:var(--fs-meta);display:flex;flex-wrap:wrap;gap:.4rem;justify-content:flex-end}
.neg{color:var(--red)}
.acts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 .95rem;border-radius:8px;background:var(--surface2);border:1px solid var(--border2);cursor:pointer;white-space:nowrap;font-weight:600;font-size:.88rem;color:var(--txt);text-decoration:none!important}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn--pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#04121A)}.btn--pri:hover{color:var(--on-accent,#04121A);filter:brightness(.9)}
.note{color:var(--muted);font-size:var(--fs-meta);margin:0 0 .5rem}
.note--pie{margin:.6rem 0 0}
.ok-line--warn{color:var(--amber)}
.plan{margin-top:.75rem;padding:.75rem;border:1px solid var(--border2);border-radius:8px;background:var(--surface2);font-size:var(--fs-meta)}
.plan table{width:100%;border-collapse:collapse;table-layout:fixed}
.plan th{color:var(--muted);font-weight:500;text-align:left;padding:.25rem .4rem .25rem 0}
.plan td{padding:.35rem .4rem .35rem 0;border-top:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan .r{text-align:right;width:6.5rem}
.plan .sub{display:block;color:var(--muted);white-space:normal;overflow-wrap:anywhere}
.plan .nocalc{margin:.6rem 0 0;color:var(--muted);overflow-wrap:anywhere}
.res{margin:.6rem 0 0;font-size:var(--fs-meta)}
.res.ok{color:var(--green)}.res.warn{color:var(--amber)}.res.bad{color:var(--red)}
.comp{grid-column:1 / -1;min-width:0;max-width:100%;overflow-wrap:anywhere;font-size:var(--fs-meta);line-height:1.5;padding:.3rem 0 .5rem}
.comp .tw{overflow-x:auto;max-width:100%}
.comp table{border-collapse:collapse;width:100%;min-width:420px;margin-top:6px}
.comp th,.comp td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
.cf-ok{color:var(--green);font-weight:700}.cf-mal{color:var(--red);font-weight:700}

.sales{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:.75rem;margin-bottom:.75rem}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.8rem 1rem}
.kpi .n{font-size:1.5rem;font-weight:700}
.kpi .l{color:var(--muted);font-size:var(--fs-meta)}
details.orders{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
details.orders summary{cursor:pointer;min-height:var(--tap-min);display:flex;align-items:center;padding:0 1rem;color:var(--accent);list-style:none}
details.orders summary::-webkit-details-marker{display:none}
.or{display:grid;grid-template-columns:88px minmax(0,1fr) auto auto;gap:.75rem;align-items:center;padding:.55rem 1rem;border-top:1px solid var(--border);font-size:.88rem}
.or .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.or .when{color:var(--muted);font-size:var(--fs-meta);white-space:nowrap}
.tag{font-size:var(--fs-label);padding:.15rem .5rem;border-radius:var(--radius-pill);border:1px solid;white-space:nowrap}
.tag.ok{color:var(--green);border-color:var(--green-bd);background:var(--green-bg)}
.tag.canc{color:var(--amber);border-color:var(--amber-bd);background:var(--amber-bg)}

.band{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface2);border-top:1px solid var(--border2);box-shadow:0 -8px 24px rgba(0,0,0,.45)}
.band.ok{border-top-color:var(--green-bd)}.band.warn{border-top-color:var(--amber-bd)}.band.bad{border-top-color:var(--red-bd)}
.band>div{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:.75rem;padding:.4rem var(--gutter);padding-bottom:calc(.4rem + env(safe-area-inset-bottom))}
.band .msg{flex:1 1 0;min-width:0;overflow-wrap:anywhere}
.band.ok .msg::before{content:"✓ ";color:var(--green)}
.band.warn .msg::before{content:"⚠ ";color:var(--amber)}
.band.bad .msg::before{content:"✗ ";color:var(--red)}
.band .bacts{display:flex;flex-wrap:wrap;gap:.5rem}
.band .bacts .btn{min-height:var(--tap-min)}
.band .bx{background:none;border:0;color:var(--accent);min-width:var(--tap-min);min-height:var(--tap-min);cursor:pointer;font-size:1.1rem}
.sk{height:64px;border-top:1px solid var(--border);background:linear-gradient(90deg,var(--surface),var(--surface2),var(--surface));background-size:200% 100%;animation:sh 1.2s infinite}
.sk:first-child{border-top:0}
.sk--st{height:62px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1.5rem}
.sk--st.sk--lleno{width:100%;margin:0;border:0}
.sk.sk--kpi{height:70px}
@keyframes sh{to{background-position:-200% 0}}
.errbox{padding:1rem;display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between;color:var(--red)}

@media (max-width:640px){
  .iconbtn .lbl,.iconbtn .car{display:none}
  .ih{grid-template-columns:4px 40px minmax(0,1fr) auto;column-gap:.6rem;padding-right:.75rem}
  .ih .n{font-size:1.2rem}
  .ih .go .txt{display:none}
  .ih .go{min-width:24px;justify-content:flex-end}
  .ib{padding:0 .75rem .9rem}
  .mr{grid-template-columns:44px 48px minmax(0,1fr);row-gap:.1rem}
  .mr.noc,.mr--f{grid-template-columns:48px minmax(0,1fr)}
  .mr.mr--f .v{grid-column:2}
  .mr .ph{width:48px;height:48px;grid-row:1 / span 2}
  .mr .tt b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .mr .v{grid-column:3;text-align:left;justify-content:flex-start}
  .mr.noc .v{grid-column:2}
  .mr.noc .v .btn{flex:1 1 100%;min-height:var(--tap-min);margin-top:.35rem}
  .mr .cbx{grid-row:1 / span 2}
  .btn{min-height:var(--tap-min);white-space:normal;text-align:center;padding-block:.35rem}
  .acts .btn{flex:1 1 100%}
  .mr .v .btn{flex:1 1 auto}
  .or{grid-template-columns:minmax(0,1fr) auto;row-gap:.1rem}
  .or .num,.or .who,.or .when{grid-column:1}
  .or .tag{grid-row:1 / span 3;grid-column:2}
  .flows{flex-direction:column}
  .flows span{white-space:normal}
  .plan thead{display:none}
  .plan table,.plan tbody{display:block}
  .plan tr{display:grid;grid-template-columns:1fr 1fr;padding:.4rem 0;border-top:1px solid var(--border)}
  .plan td{border:0;padding:.1rem 0;width:auto}
  .plan td:first-child{grid-column:1 / -1;white-space:normal}
  .plan td.r{text-align:left;overflow:visible}
  .plan td.r.hoy::before{content:"Hoy "}
  .plan td.r.nuevo::before{content:"Nuevo ";font-weight:400}
  .band .bacts .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="crumb"><a href="/herramientas/home/">&larr; Inicio</a></div>
  <div class="head">
    <h1>Sincronización ML</h1>
    <div class="tools">
      <button class="iconbtn" id="refresh" type="button" aria-label="Actualizar"><span aria-hidden="true">↻</span><span class="lbl">Actualizar</span></button>
      <div class="menuwrap">
        <button class="iconbtn" id="mbtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="Correr ahora"><span aria-hidden="true">⟳</span><span class="lbl">Correr ahora</span><span class="car" aria-hidden="true">▾</span></button>
        <div class="menu" id="menu" role="menu" hidden>
          <button type="button" role="menuitem" data-run="ml-wc">Traer ventas de ML<small>Llegan solas al instante; esto es por si faltó una</small></button>
          <button type="button" role="menuitem" data-run="wc-ml">Sincronizar stock<small>Corre solo cada 10 min</small></button>
          <button type="button" role="menuitem" data-run="cancel">Procesar cancelaciones<small>Devuelve el stock de las ventas canceladas</small></button>
          <hr>
          <button type="button" role="menuitem" data-run="muertas">Limpiar variaciones muertas<small>Descarta las que ML confirma que ya no existen; no borra nada que ML no confirme</small></button>
        </div>
      </div>
    </div>
  </div>
  <section class="status" id="status" aria-live="polite"><div class="big"><span class="dot"></span><span>Revisando…<small>Consultando ML y la web</small></span></div></section>
  <h2 class="sec" id="inch">Para resolver</h2>
  <section class="inc" id="inc" aria-labelledby="inch"></section>
  <h2 class="sec" id="ventash">Ventas de ML en la web</h2>
  <div class="sales" id="sales"></div>
  <details class="orders" id="ordersbox" hidden><summary>Ver los últimos 5 pedidos</summary><div id="orders"></div></details>
</main>
<div class="band" id="band" role="status" hidden><div><span class="msg" id="bandmsg"></span><span class="bacts" id="bandacts"></span><button class="bx" id="bandx" type="button" aria-label="Cerrar aviso">✕</button></div></div>

<script src="../lib/format.js"></script>
<script src="../lib/api.js"></script>
<script>
Api.installAuth();
var $=function(s){return document.querySelector(s)};
var SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="16" r="4"/><circle cx="18" cy="16" r="4"/><path d="M6 16l4-8h5l3 8M10 8l-1-2H7"/></svg>';
var CHEV='<svg class="chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>';
var SEV={crit:0,warn:1,info:2};
var D=null, frenadas=[], formato=[], estado='cargando', sinPermiso=false, cargaOk={fren:false,form:false};
var open=new Set(), selFr=new Set(), planPrecios=null, corriendo=false, confirmaForzar=false;

/* ---------- helpers ---------- */
function urlSegura(u,https){
  if(typeof u!=='string'||!/^https?:\/\//i.test(u))return null;
  return https?u.replace(/^http:\/\//i,'https://'):u;
}
function ph(url){
  var u=urlSegura(url,true);
  return '<div class="ph" aria-hidden="true">'+(u?'<img src="'+esc(u)+'" alt="" loading="lazy">':SVG)+'</div>';
}
document.addEventListener('error',function(e){var t=e.target;if(t&&t.tagName==='IMG'&&t.parentNode&&t.parentNode.classList.contains('ph'))t.parentNode.innerHTML=SVG},true);
function hace(iso){
  if(!iso)return 'nunca';
  var t=Date.parse(String(iso).indexOf('T')<0&&String(iso).indexOf('Z')<0?String(iso).replace(' ','T')+'Z':iso); if(!isFinite(t))return '—';
  var m=Math.max(0,Math.round((Date.now()-t)/60000));
  if(m<1)return 'hace instantes'; if(m<60)return 'hace '+m+' min';
  var h=Math.round(m/60); if(h<24)return 'hace '+h+' h';
  var d=Math.round(h/24); if(d<14)return 'hace '+d+(d===1?' día':' días');
  return 'hace '+Math.round(d/7)+' sem';
}
function venceEl(iso){
  var t=Date.parse(iso); if(!isFinite(t))return '—';
  return new Date(t).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
}
function sumResumen(r){return Object.keys(r||{}).reduce(function(a,k){return a+(r[k]||0)},0)}
async function leerJson(r){
  if(r.status===403){var pe=new Error('No tenés permiso para ver esto.');pe.permiso=true;throw pe}
  var t=await r.text(),d;
  try{d=JSON.parse(t)}catch(_e){throw new Error('el servidor respondió '+r.status+' sin datos')}
  if(!d||!d.ok)throw new Error((d&&d.error)||('HTTP '+r.status));
  return d;
}

/* ---------- franja inferior persistente ---------- */
function band(tipo,html,acciones){
  var b=$('#band');
  b.className='band '+tipo;
  $('#bandmsg').innerHTML=html;
  $('#bandacts').innerHTML=acciones||'';
  b.hidden=false;
}

/* ---------- carga ---------- */
async function cargar(){
  if(!D){estado='cargando';render();}
  $('#refresh').disabled=true;
  try{
    var d=await leerJson(await fetch('/api/sync/dashboard'));
    D=d; estado='lista';
  }catch(e){ sinPermiso=!!e.permiso; if(!D)estado='error'; }
  var res=await Promise.all([
    fetch('/api/sync/frenadas').then(leerJson).then(function(d){frenadas=d.data||[];return true},function(){return false}),
    fetch('/api/sync/cambios-formato').then(leerJson).then(function(d){formato=d.data||[];return true},function(){return false})
  ]);
  cargaOk.fren=res[0]; cargaOk.form=res[1];
  var ids=new Set(frenadas.map(function(p){return p.item_id}));
  selFr.forEach(function(x){if(!ids.has(x))selFr.delete(x)});
  $('#refresh').disabled=false;
  render();
  irAHash();
}

/* ---------- incidencias ---------- */
function incidencias(){
  var at=(D&&D.atencion)||{};
  var nPaus=sumResumen(D&&D.pausadas_con_stock);
  var nFren=cargaOk.fren?frenadas.length:((D&&D.frenadas)||0);
  var nForm=cargaOk.form?formato.length:0;
  return [
    {k:'err',sev:'crit',n:at.errores_reales||0,t:'Errores que no se resolvieron solos',d:'ML rechazó la actualización de stock y no se arregló con el reintento automático.',go:'Ver y reintentar',href:'/herramientas/sync-detalle/?cat=errores'},
    {k:'foto',sev:'crit',n:at.requiere_atencion_ml||0,t:'Exceso de fotos en ML',d:'ML no deja actualizar estas publicaciones hasta bajar la cantidad de fotos en tu cuenta de ML.',go:'Ver detalle',href:'/herramientas/sync-detalle/?cat=requiere_atencion_ml'},
    {k:'paus',sev:'warn',n:nPaus,t:'Pausadas con stock en la web',d:'Pausadas en ML con stock para vender.',go:'Revisar',href:'/herramientas/sync-ml/pausadas/'},
    {k:'map',sev:'warn',n:at.sin_mapeo||0,t:'Ventas sin producto de la web',d:'Se vendieron en ML sin estar unidas a un producto: el stock no se descontó.',go:'Resolver',href:'/herramientas/sync-detalle/?cat=sin_mapeo'},
    {k:'remap',sev:'warn',n:at.remapeo_requerido||0,t:'Variaciones a re-mapear',d:'Cambiaron en ML (se editó la publicación). Volvé a asignarles el producto.',go:'Resolver',href:'/herramientas/sync-detalle/?cat=remapeo_requerido'},
    {k:'fren',sev:'warn',n:nFren,t:'Frenadas por precio',d:'Tienen stock, pero al precio de ML venderían bajo el contado.',go:'Ver',exp:true},
    {k:'form',sev:'info',n:nForm,t:'Cambiaron de producto en ML',d:'Confirmá que siguen siendo lo mismo.',go:'Ver',exp:true}
  ].filter(function(i){return i.n>0}).sort(function(a,b){return SEV[a.sev]-SEV[b.sev]});
}
function oks(I){
  var hay={};I.forEach(function(i){hay[i.k]=1});
  if(!cargaOk.fren)hay.fren=1;
  if(!cargaOk.form)hay.form=1;

var planHtml='';
function planFila(x){
  var p=frenadas.filter(function(f){return f.clave===x.clave})[0]||{};
  var t=esc(x.sku||p.titulo||x.item_id||x.clave);
  return '<tr><td title="'+t+'">'+t+'<span class="sub">Deja '+money(x.neto)+' de neto'+(x.cruza_umbral_envio?' · cambia el envío':'')+'</span></td><td class="r hoy num">'+money(x.precio_actual)+'</td><td class="r nuevo num"><b>'+money(x.precio)+'</b></td></tr>';

async function verPlan(){
  var claves=frenadas.filter(function(p){return selFr.has(p.item_id)}).map(function(p){return p.clave}).filter(Boolean);
  var box=$('#planbox');
  if(!claves.length){planHtml='<p class="res warn">⚠ Elegí al menos una.</p>';box.innerHTML=planHtml;return}
  planHtml='<p class="res">Calculando el precio de '+claves.length+' publicación(es)… se le pregunta a MercadoLibre la comisión y el envío de cada precio candidato.</p>';
  box.innerHTML=planHtml;
  try{
    var d=await leerJson(await fetch('/api/precios/objetivo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({claves:claves})}));
    var ok=(d.resultados||[]).filter(function(x){return x.precio!=null}), no=(d.resultados||[]).filter(function(x){return x.precio==null});
    planPrecios=ok;
    planHtml=ok.length
      ?'<div class="plan"><table><thead><tr><th>Publicación</th><th class="r">Precio hoy</th><th class="r">Nuevo</th></tr></thead><tbody>'+ok.map(planFila).join('')+'</tbody></table>'
        +(no.length?'<p class="nocalc"><b>Sin precio calculado ('+no.length+'):</b><br>'+no.map(function(x){return esc(x.sku||x.clave)+' — '+esc(x.motivo||'sin motivo')}).join('<br>')+'</p>':'')
        +'<div class="acts"><button class="btn btn--pri" type="button" data-apply>Aplicar '+ok.length+' y reactivar</button><button class="btn" type="button" data-cancelplan>Cancelar</button></div></div>'
      :'<p class="res bad">No se pudo calcular ningún precio.'+(no.length?'<br>'+no.map(function(x){return esc(x.sku||x.clave)+' — '+esc(x.motivo||'sin motivo')}).join('<br>'):'')+'</p>';
  }catch(e){planHtml='<p class="res bad">No se pudo calcular: '+esc(e.message)+'</p>'}
  var b2=$('#planbox'); if(b2)b2.innerHTML=planHtml;
}
async function aplicarPlan(){
  if(!planPrecios||!planPrecios.length||corriendo)return;
  corriendo=true;
  var lista=planPrecios, aplicados=[], fallados=[];
  for(var i=0;i<lista.length;i++){
    band('warn','Aplicando precios: '+(i+1)+' de '+lista.length+'…');
    var x=lista[i];
    try{
      await leerJson(await fetch('/api/precios/actualizar-precio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clave:x.clave,precio:x.precio})}));
      aplicados.push(x);
    }catch(e){fallados.push({x:x,error:e.message})}
  }
  var reactivadas=0, errReact=null;
  if(aplicados.length){
    try{
      var dd=await leerJson(await fetch('/api/sync/reactivar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({itemIds:aplicados.map(function(x){return x.item_id})})}));
      reactivadas=dd.reactivados!=null?dd.reactivados:aplicados.length;
    }catch(e){errReact=e.message}
  }
  var msg=aplicados.length+' precio(s) corregido(s)'+(reactivadas?' y '+reactivadas+' reactivada(s) en ML':'')+'.';
  if(errReact)msg+=' La reactivación falló: '+esc(errReact)+'.';
  if(fallados.length)msg+=' No se pudieron corregir '+fallados.length+' (y por eso no se reactivaron): '+fallados.map(function(f){return esc(f.x.sku||f.x.clave)+' — '+esc(f.error)}).join(' | ')+'.';
  band(fallados.length||errReact?'warn':'ok',msg);
  planPrecios=null;planHtml='';selFr.clear();corriendo=false;
  await cargar();
}
async function forzar(){
  var sel=Array.from(selFr);
  confirmaForzar=false;
  if(!sel.length||corriendo){renderInc();return}
  corriendo=true;
  band('warn','Reintentando la reactivación de '+sel.length+'… vuelve a chequear el precio, no lo saltea.');
  try{
    var d=await leerJson(await fetch('/api/sync/frenadas/forzar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({itemIds:sel})}));
    var ok=(d.resultados||[]).filter(function(x){return x.ok}), no=(d.resultados||[]).filter(function(x){return !x.ok});
    var m=[];
    if(ok.length)m.push(ok.length+' reactivada(s)');
    if(no.length)m.push(no.length+' siguen frenadas: '+no.map(function(x){return esc(x.item_id)+' ('+esc(x.error||x.motivo||'motivo desconocido')+')'}).join(' | '));
    if(d.truncado)m.push('se pidieron '+n(d.pedidos)+' pero solo se procesaron '+n(d.procesados)+'; el resto entra en el próximo ciclo');
    band(no.length?'warn':'ok',m.join(' · ')||'Sin cambios.');
  }catch(e){band('bad','No se pudo reintentar: '+esc(e.message))}
  corriendo=false; selFr.clear(); await cargar();
}

async function reactivarAhora(btn,id){

function cerrarMenu(){$('#menu').hidden=true;$('#mbtn').setAttribute('aria-expanded','false')}
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('button,a,summary');
  if(!t||!t.closest('.menuwrap'))cerrarMenu();
  if(!t)return;
  var d=t.dataset;
  if(t.id==='mbtn'){var m=$('#menu');m.hidden=!m.hidden;t.setAttribute('aria-expanded',String(!m.hidden));if(!m.hidden)m.querySelector('button').focus();return}
  if(d.renovar!==undefined){renovarConexion(t);return}
  if(d.run){cerrarMenu();correr(d.run);return}
  if(t.id==='refresh'||d.reload!==undefined){cargar();return}
  if(t.id==='bandx'){$('#band').hidden=true;return}
  if(d.k){open.has(d.k)?open.delete(d.k):open.add(d.k);renderInc();return}
  if(d.frTodas!==undefined){
    var ids=frenadas.map(function(p){return p.item_id}).filter(Boolean);
    if(selFr.size===ids.length)selFr.clear();else ids.forEach(function(x){selFr.add(x)});
    planHtml='';planPrecios=null;confirmaForzar=false;renderInc();return;
  }
  if(d.plan!==undefined){verPlan();return}
  if(d.cancelplan!==undefined){planHtml='';planPrecios=null;renderInc();return}
  if(d.apply!==undefined){aplicarPlan();return}
  if(d.forzar!==undefined){confirmaForzar=true;renderInc();return}
  if(d.forzarNo!==undefined){confirmaForzar=false;renderInc();return}
  if(d.forzarOk!==undefined){forzar();return}
  if(d.ok){revisar(d.ok,true,t);return}
  if(d.pausada){revisar(d.pausada,false,t);return}
  if(d.comp){comparar(d.comp,t);return}
  if(d.cfReactivar!==undefined){reactivarAhora(t,d.id);return}
});
document.addEventListener('change',function(e){
  var c=e.target;
  if(c.dataset&&c.dataset.fr!==undefined){
    if(c.checked)selFr.add(c.dataset.fr);else selFr.delete(c.dataset.fr);
    planHtml='';planPrecios=null;confirmaForzar=false;renderInc();
    var again=document.querySelector('[data-fr="'+(window.CSS&&CSS.escape?CSS.escape(c.dataset.fr):c.dataset.fr)+'"]');if(again)again.focus();
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#menu').hidden){cerrarMenu();$('#mbtn').focus()}
});
cargar();
</script>

<script>
(function(){
  var seg = (location.pathname.match(/\/herramientas\/([a-z0-9-]+)\//)||[])[1] || '';
  var tool = seg === 'sync-detalle' ? 'sync-ml' : seg;
  fetch('/api/auth/me').then(function(r){
    return r.json();
  }).then(function(d){
    if (!d || !d.ok) return;
    var isAdmin = !!d.is_admin || (d.scopes && d.scopes.indexOf('all') !== -1);
    if (isAdmin || !tool) return;
    var ok = (d.permisos||[]).some(function(p){ return p.herramienta === tool; });
    if (!ok) location.href = '/herramientas/home/';
  }).catch(function(){});
})();
</script>
